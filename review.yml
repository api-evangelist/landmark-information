findings:
  headline: >-
    Public contracts, private runtime. Landmark is the mirror image of the US MLS pattern: in the US
    a RESO-certified endpoint often exists while its contract sits behind a member login; here the
    contract is fully open and the endpoint is behind a commercial account.
  reso: >-
    No RESO reference found. No Web API certification, no Data Dictionary certification, no UPI, no
    OData $metadata. RESO does not operate in the UK because the UK has no MLS to mandate it. The
    identifier that actually does the work is the government-issued UPRN.
  accessGate: partner-only
  openData: false
  gated: true
  specsHarvested: 5
  apisListed: 7
  notableAbsences:
  - No listings or property-search API of any kind.
  - No SDKs, no Postman collection, no status page, no standalone changelog, no AsyncAPI.
  - No OAuth scopes published; entitlement is account-level and server-side.
  - No open data published by Landmark itself.
  notablePresences:
  - Five complete, parseable OpenAPI 3.x contracts freely readable without any account.
  - A real webhook subscription API (Milestone Notification Service) for valuation milestones.
  - Documented rate limits and a documented UAT environment that is explicitly not charged.
  - Prose-quality API documentation with worked examples, error shapes, and a `traceresponse` header for support.
