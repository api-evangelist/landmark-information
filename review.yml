apiFamilySegmentation:
  note: Landmark's own product segmentation, reproduced faithfully rather than remapped.
  listingsOrSearch:
    present: false
    note: >-
      Landmark does not operate a listings API. UK residential listings sit with Rightmove and
      Zoopla. Landmark's estate-agency products (LandmarkAgent, Metropix) are compliance, material
      information, floor plans and search packs — inputs to a listing, not the listing feed.
  propertyRecordsAndRisk:
    present: true
    apiExposed: partial
    note: >-
      Envirocheck, RiskView, SiteSolutions, flood/coal/chancel/planning reports are ordered as
      products. A "Property Risk v3" API exists in the portal source but is commented out and 404s.
  valuationAvm:
    present: true
    apiExposed: partial
    note: >-
      Valuation Risk Modelling, mortgage valuations, Q-Guard fraud detection and the Secure Panel
      Network (SPN/SPN+) are real products handling ~1.5m valuation instructions a year, but the
      only public API surface is the Milestone Notification Service callback registration API.
  transactionsAndCaseManagement:
    present: true
    apiExposed: true
    apis: [Conveyancing Experience API, Intelliworks APIs]
  documents:
    present: true
    apiExposed: true
    apis: [Document Vault API]
  complianceAndIdentity:
    present: true
    apiExposed: true
    apis: [Order Experience API]
  geospatialAndPlanning:
    present: true
    apiExposed: true
    apis: [Planning API (Barbour ABI), Web Map Tile Service (OGC WMTS)]
    note: >-
      AddressBase/UPRN addressing (29m+ addresses), Promap, historical maps, PointX POI and
      geospatial consulting are delivered as data supply and managed services rather than
      self-describing APIs.
  tenancyAndPayments:
    present: false
    note: >-
      No tenancy or rentals API. Payments appear only as LandmarkAgent third-party payments terms;
      no payment API is documented.

webhooksEventsSdksTooling:
  webhooks:
    present: true
    mechanism: >-
      The Milestone Notification Service API is a callback-registration surface — POST /callbacks,
      PUT /callbacks/{callbackId}, DELETE /callbacks/{callbackId} — for valuation transaction
      milestone notifications. This is a genuine webhook subscription API, unusual for this sector.
    asyncapiPublished: false
  events:
    present: false
    note: No event streaming, message queue, or pub/sub surface is documented.
  sdks:
    present: false
    note: >-
      No SDKs or client libraries published. The GitHub organisation
      https://github.com/Landmark-Information-Group holds only two public repositories — a C# coding
      test ("playground--interviews--refactor") and an Azure DevOps tooling repo — both last touched
      in August 2022. Neither is an API artefact.
  postmanCollections:
    present: false
    note: >-
      No Postman collection is published or linked. https://www.landmarkcloudservices.com/postman.json
      returned 404. A https://www.postman.com/landmark-information-group request returned the generic
      Postman SPA shell with no workspace content, which is not evidence of a workspace; recorded as
      absent.
  statusPage:
    present: false
    note: >-
      status.landmark.co.uk and status.landmarkcloudservices.com do not resolve (connection failure,
      curl exit 000). No public uptime or incident page found.
  changelog:
    present: true
    mechanism: >-
      Versioned change history is embedded in each spec's `info.description` — the Order Experience
      API carries a dated version log from 0.9.2 through 1.3.1 (2026-04-15). There is no standalone
      changelog page or feed.
  rateLimits:
    documented: true
    values:
    - api: Document Vault API
      limit: 1,000 calls per minute per caller
    - api: Milestone Notification Service API
      limit: 250 requests per customer per minute
    - api: Planning API
      limit: unspecified; 429 returned on excess, described as "very high"
  environments:
    uat: https://uat-api.landmarkcloudservices.com
    production: https://api.landmarkcloudservices.com
    note: UAT credentials are issued separately and UAT usage is documented as not charged.

