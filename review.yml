aid: landmark-information
name: Landmark Information Group
review:
  question: >-
    Does Landmark Information Group expose a real, publicly documented API surface, and where does
    it sit against RESO certification, access gating, and open property data in the United Kingdom?
  answer: true
  date: '2026-07-26'
  reviewer: API Evangelist
  summary: >-
    Yes — and it is one of the more honest surfaces in this sector. Landmark runs a genuinely public,
    login-free API documentation portal at https://www.landmarkcloudservices.com/ that publishes
    complete OpenAPI 3.x contracts for five APIs, plus a full public HTML technical pack for a sixth
    (the Barbour ABI-powered Planning API) and a named-standard seventh (an OGC WMTS mapping
    service with no published endpoint). Reading the contracts requires nothing. Calling any of them
    requires a commercial account: OAuth 2.0 client credentials issued by Landmark against its Auth0
    tenant, or a Landmark-issued API key plus login credentials for the Planning API. RESO is
    entirely absent, which is the correct answer for a UK company.

homeMarket:
  country: United Kingdom
  hq: Exeter, Devon, England
  parent: Daily Mail and General Trust (DMGT)
  companiesHouseNumber: '02892803'
  positionInValueChain: >-
    Transaction-side data and workflow infrastructure, not listings. The UK has no MLS; residential
    listings are controlled by the Rightmove/Zoopla portal duopoly and reached through agency CRMs
    (Reapit, Alto, Street, Apex27). Landmark sits underneath that layer, supplying conveyancing
    search reports, AML/compliance checks, case management software, panel/valuation infrastructure
    for lenders and surveyors, and licensed geospatial data derived from Ordnance Survey, HM Land
    Registry and ~400 other suppliers.

resoPosture:
  short: No RESO reference found — RESO is absent from the UK market and from Landmark's surface
  certified: false
  webApiCertification: none found
  dataDictionaryCertification: none found
  dataDictionaryVersion: null
  certificationDirectoryEvidence: >-
    No listing exists to cite. RESO certification is administered against North American MLS
    organisations under NAR policy; Landmark Information Group is a UK company with no MLS
    relationship, no NAR membership path, and no reason to certify. Nothing on landmark.co.uk or
    landmarkcloudservices.com references RESO, RETS, the RESO Data Dictionary, or the RESO Web API.
  universalPropertyIdentifier:
    present: false
    note: >-
      No RESO Universal Property Identifier (UPI) anywhere. The UK equivalent Landmark actually uses
      is the Ordnance Survey Unique Property Reference Number (UPRN), which appears throughout the
      harvested specs (168 occurrences across the Order/Intelliworks/Document Vault contracts) and
      is the headline attribute of Landmark's AddressBase addressing product. UPRN is a national
      government identifier, not an industry-body one — the inverse of the RESO/UPI model.
  odataAndMetadata:
    odataService: false
    metadataDocumentFound: false
    note: >-
      The Conveyancing Experience API borrows OData-style query syntax — its list endpoints document
      `$filter` and `$orderby` parameters (8 occurrences in the harvested spec) — but it is a plain
      JSON REST API, not an OData service. No `$metadata` document is served. Probed
      https://api.landmarkcloudservices.com/$metadata (HTTP 403),
      https://api.landmarkcloudservices.com/connect/$metadata (HTTP 403) and
      https://www.landmarkcloudservices.com/$metadata (HTTP 404). Do not read the OData query
      syntax as any kind of RESO alignment; the resemblance is superficial.
  interpretation: >-
    Certification is not reachability, and in the UK the question does not even arise. There is no
    mandated machine-readable listing contract in this market because there is no cooperative to
    mandate it. What the UK has instead is open government property data (HM Land Registry Price
    Paid, Ordnance Survey open products) — but that belongs to the public sector, not to Landmark.
    Landmark is a licensee and reseller of that layer, not a publisher of it.

accessGate:
  classification: partner-only
  gated: true
  whatADeveloperMustSignOrJoin: >-
    A commercial account with Landmark. There is no self-serve signup anywhere in the surface and no
    public key issuance. The Conveyancing Experience API documentation states plainly: "When you're
    onboarded you'll receive a client ID and secret" and "Your Landmark contact will confirm what's
    available to you and when." The Document Vault API states: "Each conveyancing firm is onboarded
    individually with Landmark and receives its own client ID, secret, and Account-Id... If you
    integrate via a case management system, that system typically holds the firm's credentials on
    its behalf." The Planning API documentation states: "Access to the APIs is a subscription
    service and the set of accessible projects may be restricted based on the agreed subscription",
    offered as either an annual subscription or pay-as-you-go metered access, with a two-week trial
    available via a "Request a trial" form. The WMTS mapping service begins with a
    register-your-interest form at https://geodata.landmark.co.uk/register-your-interest-in-wmts
    (HTTP 200) followed by a commercial agreement.
  isMembershipRequired: false
  isBrokerOrAgentOnly: false
  isLicenceAgreement: >-
    Effectively yes at the data layer — Landmark's mapping, addressing and risk data is derived from
    Ordnance Survey, HM Land Registry and ~400 suppliers under onward-licence terms — but the gate a
    developer actually encounters is a commercial contract, not a signed IDX/VOW-style data licence.
  documentationIsPublic: true
  documentationGateNote: >-
    Important distinction: the documentation is completely open (no login, no email wall, no
    click-through), and the full OpenAPI contracts are embedded in the pages and therefore
    harvestable. The runtime is closed. This is the reverse of the common US real-estate pattern,
    where a certified endpoint exists but its contract is behind a member portal.

openData:
  landmarkPublishesOpenData: false
  note: >-
    Landmark publishes no open, unlicensed, publicly callable dataset. Everything it sells is
    licensed. The genuinely open UK property layer exists — HM Land Registry Price Paid Data and
    ownership data under the Open Government Licence, and Ordnance Survey open products — but those
    are separate public-sector publishers and are Landmark's suppliers, not Landmark products.
    Landmark's free public artefacts are documentation and quarterly residential property trends
    reports (HTML/PDF), not data APIs.

authModel:
  primary: OAuth 2.0 client credentials (Auth0), bearer JWT
  tokenEndpointProduction: https://lmkmaster.eu.auth0.com/oauth/token
  tokenEndpointUat: https://lmkmaster-uat.eu.auth0.com/oauth/token
  audienceProduction: https://api.landmarkcloudservices.com
  audienceUat: https://uat-api.landmarkcloudservices.com
  additionalHeaders:
  - name: Account-Id
    appliesTo: Document Vault API
    note: Per-firm account identifier sent on every request alongside the bearer token.
  scopes:
    declaredInSpecs: false
    note: >-
      The Conveyancing API declares an OAuth2 clientCredentials flow with an EMPTY scopes object.
      Entitlement is enforced server-side per account (a 403 means "your account isn't entitled to
      that operation"), not via OAuth scopes. No scope strings are published anywhere, so none are
      recorded — none were invented.
  openidConfiguration:
    url: https://lmkmaster.eu.auth0.com/.well-known/openid-configuration
    httpStatus: 200
    fetched: '2026-07-26'
    savedAs: authentication/landmark-information-openid-configuration.json
    note: >-
      Fetched anonymously. Standard Auth0 tenant discovery document; issuer
      https://lmkmaster.eu.auth0.com/, grant_types_supported includes client_credentials, jwks_uri
      https://lmkmaster.eu.auth0.com/.well-known/jwks.json. The scopes_supported list is Auth0's
      generic OIDC set (openid, profile, email, ...) and is NOT a Landmark API scope list — it must
      not be read as one.
  secondary:
    name: Planning API (Barbour ABI)
    scheme: >-
      Landmark-issued API key in an `x-api-key` header, plus a login exchange — GET
      https://api.barbour-abi.com/v4/login with `Authorization: Basic <base64(username:sha256(password))>`
      and the x-api-key header — returning a bearer token in a response header. Token expires after
      30 days of disuse or on major release. GET /logout invalidates it explicitly. Entirely separate
      from the Auth0 estate.

developerPortal:
  url: https://www.landmarkcloudservices.com/
  httpStatus: 200
  confirmed: true
  selfServeKeys: false
  shape: >-
    A single-page portal with an API selector that loads a per-API Redoc-rendered page in an iframe
    (`?api=<slug>` → `<slug>.html`). No login, no registration, no console, no interactive try-it,
    no API key management. Purely reference documentation.
  publishedApis:
  - slug: order-experience-api
    label: Compliance API
    httpStatus: 200
  - slug: conveyances-experience-api
    label: Conveyancing Experience API
    httpStatus: 200
  - slug: intelliworks-experienceapi-CreateCase-api
    label: Intelliworks APIs
    httpStatus: 200
  - slug: document-vault-experience
    label: Contract Pack Vault
    httpStatus: 200
  - slug: milestone-service-api
    label: Milestone Service
    httpStatus: 200
  commentedOutInPortalHtml:
  - slug: intelliworks-pmsapi-api
    label: Intelliworks PMS
    httpStatus: 404
  - slug: property-risk-v3-api
    label: Property Risk v3
    httpStatus: 404
  - slug: transaction-request-experience-api
    label: Transaction Request Experience
    httpStatus: 404
  commentedOutNote: >-
    The portal's HTML `<select>` contains three additional options commented out in source — an
    Intelliworks PMS API, a Property Risk v3 API under a "Property Insights" optgroup, and a
    Transaction Request Experience API. All three return HTTP 404. They are recorded here as
    evidence of a wider internal API estate that is not currently published, and are deliberately
    NOT listed in apis.yml because no contract or documentation exists for them.

harvest:
  method: >-
    Each documentation page is a pre-rendered Redoc v2.5.0 bundle. The complete dereferenced OpenAPI
    document is embedded in the page as the `__redoc_state.spec.data` JSON object. Each was extracted
    with a JSON raw-decode from that marker, verified to parse, and written to openapi/ as YAML with
    no content alteration.
  specs:
  - file: openapi/landmark-information-order-experience-api-openapi.yml
    title: Order Experience API
    specVersion: 3.0.3
    apiVersion: 1.3.1
    apiVersionDate: '2026-04-15'
    paths: 5
    servers:
    - https://api.landmarkcloudservices.com/connect
    - https://uat-api.landmarkcloudservices.com/connect
    securitySchemes: [bearerAuth (http bearer, JWT)]
    sourceURL: https://www.landmarkcloudservices.com/order-experience-api.html
    httpStatus: 200
    fetched: '2026-07-26'
    parses: true
  - file: openapi/landmark-information-conveyancing-experience-api-openapi.yml
    title: Landmark Conveyancing Experience API
    specVersion: 3.0.3
    apiVersion: 0.8.1
    paths: 20
    servers:
    - https://api.landmarkcloudservices.com/conveyances
    - https://uat-api.landmarkcloudservices.com/conveyances
    securitySchemes: [BearerAuth (oauth2 clientCredentials, tokenUrl https://lmkmaster.eu.auth0.com/oauth/token, empty scopes)]
    sourceURL: https://www.landmarkcloudservices.com/conveyances-experience-api.html
    httpStatus: 200
    fetched: '2026-07-26'
    parses: true
    note: >-
      Only the UAT base URL is given in the getting-started table; the production server appears in
      the spec `servers` block. Add Document and Retrieve Document are marked Preview and explicitly
      not ready to build against.
  - file: openapi/landmark-information-intelliworks-api-openapi.yml
    title: Intelliworks APIs
    specVersion: 3.0.1
    apiVersion: 2.3.0
    paths: 8
    servers:
    - https://api.landmarkcloudservices.com/
    - https://uat-api.landmarkcloudservices.com/
    securitySchemes: [bearerAuth (http bearer, JWT)]
    sourceURL: https://www.landmarkcloudservices.com/intelliworks-experienceapi-CreateCase-api.html
    httpStatus: 200
    fetched: '2026-07-26'
    parses: true
  - file: openapi/landmark-information-document-vault-api-openapi.yml
    title: Document Vault API
    specVersion: 3.0.4
    apiVersion: 1.0.1
    paths: 10
    servers:
    - https://api.landmarkcloudservices.com/
    - https://uat-api.landmarkcloudservices.com/
    securitySchemes: [bearerAuth (http bearer, JWT)]
    sourceURL: https://www.landmarkcloudservices.com/document-vault-experience.html
    httpStatus: 200
    fetched: '2026-07-26'
    parses: true
    note: >-
      The spec `servers` entries are host-root, but the documentation states the real base path is
      `/document-vaults` (UAT: https://uat-api.landmarkcloudservices.com/document-vaults). apis.yml
      records https://api.landmarkcloudservices.com/document-vaults as the production baseURL on
