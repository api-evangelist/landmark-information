tone-336\">336</a></td>\n    </tr>\n    <tr>\n      <td>WillQuestionnaireReceived</td>\n      <td id=\"wills-milestone-337\"><a href=\"#wills-milestone-337\">337</a></td>\n    </tr>\n    <tr>\n      <td>PreviousWillRequested</td>\n      <td id=\"wills-milestone-338\"><a href=\"#wills-milestone-338\">338</a></td>\n    </tr>\n    <tr>\n      <td>PreviousWillReceived</td>\n      <td id=\"wills-milestone-339\"><a href=\"#wills-milestone-339\">339</a></td>\n    </tr>\n    <tr>\n      <td>InitialMeetingAttendanceNotePrepared</td>\n      <td id=\"wills-milestone-341\"><a href=\"#wills-milestone-341\">341</a></td>\n    </tr>\n    <tr>\n      <td>DraftWillPrepared</td>\n      <td id=\"wills-milestone-342\"><a href=\"#wills-milestone-342\">342</a></td>\n    </tr>\n    <tr>\n      <td>DoctorsCapacityReportRequested</td>\n      <td id=\"wills-milestone-343\"><a href=\"#wills-milestone-343\">343</a></td>\n    </tr>\n    <tr>\n      <td>DoctorsCapacityReportReceived</td>\n      <td id=\"wills-milestone-344\"><a href=\"#wills-milestone-344\">344</a></td>\n    </tr>\n    <tr>\n      <td>SeveranceOfJointTenancyApplicationPrepared</td>\n      <td id=\"wills-milestone-345\"><a href=\"#wills-milestone-345\">345</a></td>\n    </tr>\n    <tr>\n      <td>NoticeOfSeveranceOfJointTenancyPrepared</td>\n      <td id=\"wills-milestone-346\"><a href=\"#wills-milestone-346\">346</a></td>\n    </tr>\n    <tr>\n      <td>FeeEarnerRiskManagementReview</td>\n      <td id=\"wills-milestone-347\"><a href=\"#wills-milestone-347\">347</a></td>\n    </tr>\n    <tr>\n      <td>CaseLockedDownRiskConcerns</td>\n      <td id=\"wills-milestone-348\"><a href=\"#wills-milestone-348\">348</a></td>\n    </tr>\n    <tr>\n      <td>CaseUnlocked</td>\n      <td id=\"wills-milestone-349\"><a href=\"#wills-milestone-349\">349</a></td>\n    </tr>\n    <tr>\n      <td>WillSentForExecutionWithoutSupervision</td>\n      <td id=\"wills-milestone-350\"><a href=\"#wills-milestone-350\">350</a></td>\n    </tr>\n    <tr>\n      <td>MeetingWithClientForWillExecution</td>\n      <td id=\"wills-milestone-351\"><a href=\"#wills-milestone-351\">351</a></td>\n    </tr>\n    <tr>\n      <td>WillExecuted</td>\n      <td id=\"wills-milestone-352\"><a href=\"#wills-milestone-352\">352</a></td>\n    </tr>\n    <tr>\n      <td>ExecutedWillReceivedForStorage</td>\n      <td id=\"wills-milestone-353\"><a href=\"#wills-milestone-353\">353</a></td>\n    </tr>\n    <tr>\n      <td>DateClosed</td>\n      <td id=\"wills-milestone-354\"><a href=\"#wills-milestone-354\">354</a></td>\n    </tr>\n    <tr>\n      <td>DraftWillApproved</td>\n      <td id=\"wills-milestone-355\"><a href=\"#wills-milestone-355\">355</a></td>\n    </tr>\n    <tr>\n      <td>DraftWillSentForApproval</td>\n      <td id=\"wills-milestone-356\"><a href=\"#wills-milestone-356\">356</a></td>\n    </tr>\n  </tbody></table></details>\n\n### Asynchronous processing and status notifications\n\nSeveral endpoints, including create/update case, create/update task, create/update milestone, and upload document, are processed asynchronously. Each accepted request returns a `transactionRequestId` that you use to track progress.\n\nYou can receive status in either of the following ways:\n\n**1. Poll transaction status**\n\nCall `GET /transaction-requests/{transactionRequestId}`. See [Get transaction request status](#get-transaction-request-status) for supported `status` values.\n\n**2. Webhook callback (optional)**\n\nOptionally include a callback URL on the request. When processing completes, the Experience API sends an HTTP `POST` to that URL with the same status response.\n\nIf you use webhooks, tell Ochresoft in advance how your callback endpoint should be authenticated so we can configure it for your integration.\n\n### Create or update task\n\nCreate or update an **unscheduled** task on an existing Intelliworks case. Intelliworks is workflow-driven: scheduled workflow tasks cannot be created through this API. Only the unscheduled task combinations listed in [Supported unscheduled task mappings](#supported-unscheduled-task-mappings) are valid.\n\n* **Create** - omit `clientTaskId`; a new identifier is returned in the response.\n* **Update** - supply the `clientTaskId` returned from the original create response.\n* At least one of `caseId` or `externalCaseId` is required.\n* `completionDate` is mandatory when `status` is `Closed`.\n\nRequests that use a `processReference`, `taskReference`, and `taskType` combination outside the supported mapping may be rejected with an error, or the task may be created in Intelliworks but not function correctly in the workflow.\n\n<a id=\"supported-unscheduled-task-mappings\"></a>\nSupported unscheduled task mappings:\n\n<table>\n  <thead><tr><th>Task name</th><th>Process reference (Pref)</th><th>Task reference</th><th>Task type</th></tr></thead>\n  <tbody>\n    <tr><td>ATTACHMAIL</td><td>USP</td><td>MAIL2</td><td>Email</td></tr>\n    <tr><td>CDATAIMPORT</td><td>USP</td><td>IMPORTCASEDATA</td><td>Import</td></tr>\n    <tr><td>CLONEDCONTENT_EXTERNAL_ACCOUNTSTRANSACTION_ADDED</td><td>USP</td><td>SYST09</td><td>Query</td></tr>\n    <tr><td>CLONEDCONTENT_FAX</td><td>USP</td><td>SYST06</td><td>Fax</td></tr>\n    <tr><td>CLONEDCONTENT_IMPORT</td><td>USP</td><td>SYST04</td><td>Import</td></tr>\n    <tr><td>CLONEDCONTENT_SCANNER</td><td>USP</td><td>SYST05</td><td>Scanner</td></tr>\n    <tr><td>CLONEDCONTENT_VF_MESSAGE</td><td>USP</td><td>SYST08</td><td>VirtualFirmMessage</td></tr>\n    <tr><td>FAXIMPORT</td><td>USP</td><td>SYST07</td><td>Fax</td></tr>\n    <tr><td>IMPORTFILE</td><td>USP</td><td>IMPF1</td><td>Import</td></tr>\n    <tr><td>IMPORTSCAN</td><td>USP</td><td>IMPORTSCAN</td><td>Import</td></tr>\n    <tr><td>MULTI_EMAIL_IMPORT</td><td>USP</td><td>MAIL3</td><td>Action</td></tr>\n    <tr><td>SCANNERIMPORT</td><td>USP</td><td>SYST01</td><td>Scanner</td></tr>\n    <tr><td>SENDMAIL</td><td>USP</td><td>MAIL1</td><td>Email</td></tr>\n  </tbody>\n</table>\n\nMap `processReference` to **Pref**, `taskReference` to **Task reference**, and `taskType` to **Task type**. Use the **Task name** value as the task `description` unless your integration agreement specifies otherwise.\n\n### Create or update milestone\n\nSet or update milestone actual and/or forecast dates for a case. Supply `branchId`, at least one of `caseId` or `externalCaseId`, and one or more milestones. Valid `milestoneId` values are listed in [Supported milestone IDs by workflow](#supported-milestone-ids).\n\n### Upload document\n\nUpload a document against an Intelliworks case. A document can be uploaded as part of an `IMPORTFILE` task.\n\n### List case documents\n\nReturns the list of completed documents held against a case in Intelliworks for the specified branch. Supply at least one of `caseId` (Intelliworks case reference, e.g. `EXP-000762`) and/or `externalCaseId` (e.g. `AAR801/1`). Each document in the response can be downloaded using the Download document endpoint (`GET /documents/{id}/download`).\n\n### Download document\n\nDownloads a document by document ID (as returned in the List case documents response).\n\n<a id=\"get-transaction-request-status\"></a>\n### Get transaction request status\n\nReturns the latest processing status for any asynchronous Experience API request identified by `transactionRequestId`.\n\nSupported `status` values:\n\n* `Accepted`\n* `Queued`\n* `Processing`\n* `Completed`\n* `Failed`\n\nPoll `GET /transaction-requests/{transactionRequestId}` until `status` is `Completed` or `Failed`.\n\n\n# Endpoints\nThe API is accessed by making HTTPS requests to an endpoint URL.\nEvery endpoint is accessed only via the SSL-enabled HTTPS (port 443) protocol.\nThe API uses semantic versioning, and the current release is v1.0.0\n\n# Environments\nThe API is available in two environments, both are identical in that they have the same specification infrastructure and functionality.\n\nThe 2 environments are:\n* User Acceptance Testing (UAT)\n* Production (PRD)\n\n## UAT\nThe UAT environment should be used during development, and interfaces with the Intelliworks UAT environment.\nYou should use this whilst implementing and testing your integration.\n\nThe URLs for the UAT APIs are:\n* Base URL: https://uat-api.landmarkcloudservices.com/intelliworks/experience\n* Auth: https://lmkmaster.eu.auth0.com/oauth/token\n\n## PRD\nThe PRD environment is a live instance, and this talks to the live Intelliworks environment.\nThis should only be used once the integration is considered production ready and all testing has been completed on the UAT environment.\nAny actions performed on PRD will result in the creation and syncing of real data that may be seen by users.\n\nThe URLs for the production APIs are:\n* Base URL: https://api.landmarkcloudservices.com/intelliworks/experience\n* Auth: https://lmkmaster.eu.auth0.com/oauth/token\n\n# Requests & Authentication\nRequests must be sent over HTTPS with any payload formatted in JSON. To authenticate against the API a Bearer Token Header must be provided.\n\n# Rate limiting\nThe API allows a maximum of 250 requests per customer per minute.\n"
  contact:
    name: API Support
    email: support@ochresoft.com
    x-phone-number: +44 (0)3300 366 700
servers:
- url: https://api.landmarkcloudservices.com/
  description: Production API
- url: https://uat-api.landmarkcloudservices.com/
  description: UAT API
security:
- bearerAuth: []
tags:
- name: Transaction Requests
  description: APIs for tracking asynchronous request status
paths:
  /transaction-requests/{transactionRequestId}:
    get:
      summary: Get transaction request status
      description: 'Returns the latest processing status for an asynchronous Experience API request identified by

        `transactionRequestId`. Supports create/update case, upsert task, upsert milestone, document upload, and future

        asynchronous endpoints. Use this endpoint to poll for completion when a webhook callback is not used or not received.

        '
      operationId: getTransactionRequestStatus
      tags:
      - Transaction Requests
      parameters:
      - name: transactionRequestId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/lgsUuid'
        description: Unique Experience API transaction request identifier returned by asynchronous endpoints
      responses:
        '200':
          description: Latest transaction request status found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transactionRequestStatusResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
components:
  responses:
    400BadRequest:
      description: Bad Request
      headers:
        traceresponse:
          $ref: '#/components/headers/lgsTraceResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/lgsErrorResponse'
          examples:
            Invalid content type supplied:
              value:
                status: '400'
                code: '40000'
                title: Invalid content type supplied
            Validation error:
              value:
                status: '400'
                code: '40001'
                title: Validation error
            Invalid traceparent http header:
              value:
                status: '400'
                code: '40002'
                title: Invalid trace header
            No matching data found:
              value:
                status: '400'
                code: '40003'
                title: No matching data found
            Invalid header:
              value:
                status: '400'
                code: '40004'
                title: Invalid header
            Third party error:
              value:
                status: '400'
                code: '40005'
                title: Third party error
    500InternalServerError:
      description: Internal Server Error
      headers:
        traceresponse:
          $ref: '#/components/headers/lgsTraceResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/lgsErrorResponse'
          examples:
            Resource not found:
              value:
                status: '500'
                code: '50000'
                title: Internal server error
                messages:
                - message: Sorry, something has gone wrong whilst processing your request. An error has been logged and our support team will investigate this shortly. Please try again later and if the issue persists, please contact your Account Manager referencing the value 00-199c8ce55dc743a88661498aa8eb2cfc--00.
    404NotFound:
      description: Not Found
      headers:
        traceresponse:
          $ref: '#/components/headers/lgsTraceResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/lgsErrorResponse'
          examples:
            Entity not found:
              value:
                status: '404'
                code: '40401'
                title: Entity not found
    401Unauthorized:
      description: Unauthorized
      headers:
        traceresponse:
          $ref: '#/components/headers/lgsTraceResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/lgsErrorResponse'
          examples:
            Invalid identity:
              value:
                status: '401'
                code: '40100'
                title: Invalid identity
    403Forbidden:
      description: Forbidden
      headers:
        traceresponse:
          $ref: '#/components/headers/lgsTraceResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/lgsErrorResponse'
          examples:
            Invalid Entitlement:
              value:
                status: '403'
                code: '40300'
                title: Invalid Entitlement
            No Entitlement:
              value:
                status: '403'
                code: '40301'
                title: No Entitlement
            No permission to entity:
              value:
                status: '403'
                code: '40302'
                title: No permission to entity
            User not registered:
              value:
                status: '403'
                code: '40303'
                title: User not registered
            Usage limit reached:
              value:
                status: '403'
                code: '40304'
                title: Usage limit reached
            Email account not verified:
              value:
                status: '403'
                code: '40305'
                title: Email account not verified
            Token expiry too long:
              value:
                status: '403'
                code: '40306'
                title: Token expiry too long
  schemas:
    transactionRequestStatusResponse:
      type: object
      additionalProperties: false
      description: Latest status of an asynchronous Experience API transaction request
      required:
      - transactionRequestId
      - entityType
      - operationType
      - status
      - updatedDateUtc
      properties:
        transactionRequestId:
          $ref: '#/components/schemas/lgsUuid'
        transactionId:
          $ref: '#/components/schemas/lgsUuid'
        entityType:
          type: string
          enum:
          - Case
          - Milestone
          - Task
          - Document
        operationType:
          type: string
          enum:
          - Create
          - Update
          - Upload
        status:
          type: string
          enum:
          - Accepted
          - Queued
          - Processing
          - Completed
          - Failed
          description: Latest processing status for the transaction request.
        caseId:
          type:
          - string
          - 'null'
          maxLength: 25
          pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-/]*$
        externalCaseId:
          type:
          - string
          - 'null'
          maxLength: 50
          pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-]*$
        taskId:
          $ref: '#/components/schemas/lgsUuid'
        documentId:
          $ref: '#/components/schemas/lgsUuid'
        message:
          type:
          - string
          - 'null'
        errorMessage:
          type:
          - string
          - 'null'
        updatedDateUtc:
          type: string
          format: date-time
          description: UTC timestamp of the latest audit record for this transaction request
    lgsUuid:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[4][0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$
    lgsErrorResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - code
      - title
      properties:
        status:
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[0-9]{3}$
        code:
          type: string
          minLength: 5
          maxLength: 5
          pattern: ^[0-9]{5}$
        title:
          type: string
          minLength: 1
          maxLength: 100
        messages:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
            - message
            properties:
              property:
                type: string
                minLength: 1
                maxLength: 1000
              message:
                type: string
                minLength: 1
                maxLength: 1000
  headers:
    lgsTraceResponse:
      description: Trace context providing an unique identifier for an individual requests
      schema:
        type: string
        minLength: 39
        maxLength: 39
        pattern: ^[0-9a-fA-F]{2}-[0-9a-fA-F]{32}--[0-9a-fA-F]{2}$
      examples:
        Example traceresponse:
          value: 00-199c8ce55dc743a88661498aa8eb2cfc--00
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-tagGroups:
- name: General
  tags:
  - Cases
  - Documents
  - Transaction Requests
