        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/createCaseRequestIw'
              - $ref: '#/components/schemas/createCaseRequestIwPrivateClient'
              - $ref: '#/components/schemas/createCaseRequestIwProbate'
              discriminator:
                propertyName: workflowId
                mapping:
                  '210': '#/components/schemas/createCaseRequestIw'
                  '216': '#/components/schemas/createCaseRequestIw'
                  '220': '#/components/schemas/createCaseRequestIw'
                  '300': '#/components/schemas/createCaseRequestIw'
                  '350': '#/components/schemas/createCaseRequestIw'
                  '360': '#/components/schemas/createCaseRequestIw'
                  '415': '#/components/schemas/createCaseRequestIwPrivateClient'
                  '500': '#/components/schemas/createCaseRequestIwPrivateClient'
                  '601': '#/components/schemas/createCaseRequestIwProbate'
                  '700': '#/components/schemas/createCaseRequestIw'
                  '10200': '#/components/schemas/createCaseRequestIw'
                  '10400': '#/components/schemas/createCaseRequestIw'
      responses:
        '202':
          description: Accepted case update request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createCaseResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '406':
          $ref: '#/components/responses/500InternalServerError'
        '415':
          $ref: '#/components/responses/500InternalServerError'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /cases:
    get:
      summary: Get case summary
      description: 'Returns a read-only case summary for the specified branch. Supply at least one of `caseId` (Intelliworks case reference, e.g. `GPR-000856`) and/or `externalCaseId` (reference from the external system). Both are forwarded to Intelliworks when provided.

        '
      operationId: getCaseIw
      tags:
      - Cases
      parameters:
      - name: branchId
        in: query
        required: true
        description: Branch identifier (UUID) used to resolve Intelliworks company and site identifiers.
        schema:
          $ref: '#/components/schemas/lgsUuid'
      - name: caseId
        in: query
        required: false
        description: Intelliworks case reference (forwarded as `caseReference` to Intelliworks).
        schema:
          type: string
          pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-]*$
          maxLength: 50
      - name: externalCaseId
        in: query
        required: false
        description: External case reference (forwarded as `externalCaseReference` to Intelliworks).
        schema:
          type: string
          pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-]*$
          maxLength: 50
      responses:
        '200':
          description: Case summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getCaseIwResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '406':
          $ref: '#/components/responses/500InternalServerError'
        '415':
          $ref: '#/components/responses/500InternalServerError'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /upsertTask:
    post:
      summary: Create or update task
      operationId: upsertTask
      tags:
      - Cases
      description: 'Create or update an unscheduled task on an existing case. At least one of `caseId` or `externalCaseId` must be supplied.

        Only supported combinations of `processReference`, `taskReference`, and `taskType` may be used - see [Supported unscheduled task mappings](#supported-unscheduled-task-mappings).

        '
      requestBody:
        description: Request body containing task data to create or update
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/upsertTaskRequest'
              - if:
                  properties:
                    status:
                      const: Closed
                then:
                  required:
                  - completionDate
      responses:
        '202':
          description: Task upsert request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/upsertTaskResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '406':
          $ref: '#/components/responses/500InternalServerError'
        '415':
          $ref: '#/components/responses/500InternalServerError'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /milestones:
    get:
      summary: Get milestone
      description: 'Returns the actual completion date of a milestone for a case. Supply at least one of `caseId` or `externalCaseId`.

        Valid `milestoneId` values are listed in [Supported milestone IDs by workflow](#supported-milestone-ids).

        '
      operationId: getMilestone
      tags:
      - Cases
      parameters:
      - name: branchId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/lgsUuid'
      - name: caseId
        in: query
        required: false
        schema:
          type: string
          maxLength: 25
          pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-/]*$
      - name: externalCaseId
        in: query
        required: false
        schema:
          type: string
          maxLength: 50
          pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-]*$
      - name: milestoneId
        in: query
        required: true
        description: Milestone identifier. See [Supported milestone IDs by workflow](#supported-milestone-ids) for valid values per workflow.
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: workflowId
        in: query
        required: false
        description: Optional workflow identifier. Include when required to resolve the milestone for the target workflow.
        schema:
          type: integer
          format: int32
          minimum: 1
      responses:
        '200':
          description: Milestone actual completion date found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/milestoneQueryResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    post:
      summary: Create or update milestone dates
      description: 'Set or update milestone actual and/or forecast dates for a case. The request is accepted for asynchronous processing.

        '
      operationId: upsertMilestone
      tags:
      - Cases
      requestBody:
        description: Request body containing milestone upsert data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/upsertMilestoneRequest'
      responses:
        '202':
          description: Accepted milestone upsert request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/upsertMilestoneResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /transaction-requests/{transactionRequestId}:
    get:
      summary: Get transaction request status
      description: 'Returns the latest processing status for an asynchronous Experience API request identified by

        `transactionRequestId`. Supports create/update case, upsert task, upsert milestone, document upload, and future

        asynchronous endpoints. Use this endpoint to poll for completion when a webhook callback is not used or not received.

        '
      operationId: getTransactionRequestStatus
      tags:
      - Transaction Requests
      parameters:
      - name: transactionRequestId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/lgsUuid'
        description: Unique Experience API transaction request identifier returned by asynchronous endpoints
      responses:
        '200':
          description: Latest transaction request status found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transactionRequestStatusResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /documents:
    post:
      summary: Upload Document
      description: 'Uploads a document for the specified case against a task or default. At least one of `caseId` or `externalCaseId` is required.

        `taskId` is optional; when omitted the document is stored against a new default task rather than an existing task.

        Upload the file directly using `multipart/form-data`, or optionally use `application/json` with document metadata.

        '
      operationId: uploadDocument
      tags:
      - Cases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/uploadDocumentJsonRequest'
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - branchId
              - file
              anyOf:
              - required:
                - caseId
              - required:
                - externalCaseId
              properties:
                transactionId:
                  $ref: '#/components/schemas/lgsUuid'
                  description: Optional parent transaction from create case.
                branchId:
                  $ref: '#/components/schemas/lgsUuid'
                workflowId:
                  type: integer
                  format: int32
                  minimum: 1
                  description: Optional workflow identifier.
                caseId:
                  type: string
                  maxLength: 50
                  pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-/]*$
                  description: Intelliworks case reference (e.g. `EXP-000762`).
                externalCaseId:
                  type: string
                  maxLength: 50
                  pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-]*$
                  description: External case reference (e.g. `AAR801/1`).
                taskId:
                  $ref: '#/components/schemas/lgsUuid'
                  description: Optional task identifier. When omitted, a new default task is created and the document is stored against it.
                description:
                  type: string
                  maxLength: 500
                  pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-/.,' ]*$
                file:
                  type: string
                  format: binary
                  description: Document file to upload.
      responses:
        '202':
          description: Document upload request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/uploadDocumentResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '406':
          $ref: '#/components/responses/500InternalServerError'
        '415':
          $ref: '#/components/responses/500InternalServerError'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    get:
      summary: List case documents
      description: 'Returns the list of completed documents held against a case in Intelliworks for the specified branch.

        Supply at least one of `caseId` (Intelliworks case reference, e.g. `EXP-000762`) and/or `externalCaseId` (e.g. `AAR801/1`).

        Both are forwarded to Intelliworks when provided.

        Each document in the response can be downloaded using `GET /documents/{id}/download`.

        '
      operationId: getCompletedDocuments
      tags:
      - Documents
      parameters:
      - name: branchId
        in: query
        required: true
        description: Branch identifier (UUID) used to resolve Intelliworks company and site identifiers.
        schema:
          $ref: '#/components/schemas/lgsUuid'
      - name: caseId
        in: query
        required: false
        description: Intelliworks case reference (e.g. `EXP-000762`).
        schema:
          type: string
          pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-]*$
          maxLength: 50
      - name: externalCaseId
        in: query
        required: false
        description: External case reference (e.g. `AAR801/1`).
        schema:
          type: string
          pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-]*$
          maxLength: 50
      - name: workflowId
        in: query
        required: false
        description: Intelliworks workflow identifier.
        schema:
          type: integer
          format: int32
          minimum: 1
      responses:
        '200':
          description: Completed documents retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/completedDocumentsResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '406':
          $ref: '#/components/responses/500InternalServerError'
        '415':
          $ref: '#/components/responses/500InternalServerError'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /documents/{id}/download:
    get:
      summary: Download document
      description: Downloads a document by document ID (as returned in the List case documents response). Auth0Id is extracted from the authenticated user context and forwarded to Intelliworks Web API.
      operationId: downloadDocument
      tags:
      - Documents
      parameters:
      - name: id
        in: path
        required: true
        description: Document ID.
        schema:
          $ref: '#/components/schemas/lgsUuid'
      responses:
        '200':
          description: Document downloaded successfully
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request. Document ID is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authorization information is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: User does not have access to the requested document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  responses:
    400BadRequest:
      description: Bad Request
      headers:
        traceresponse:
          $ref: '#/components/headers/lgsTraceResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/lgsErrorResponse'
          examples:
            Invalid content type supplied:
              value:
                status: '400'
                code: '40000'
                title: Invalid content type supplied
            Validation error:
              value:
                status: '400'
                code: '40001'
                title: Validation error
            Invalid traceparent http header:
              value:
                status: '400'
                code: '40002'
                title: Invalid trace header
            No matching data found:
              value:
                status: '400'
                code: '40003'
                title: No matching data found
            Invalid header:
              value:
                status: '400'
                code: '40004'
                title: Invalid header
            Third party error:
              value:
                status: '400'
                code: '40005'
                title: Third party error
    401Unauthorized:
      description: Unauthorized
      headers:
        traceresponse:
          $ref: '#/components/headers/lgsTraceResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/lgsErrorResponse'
          examples:
            Invalid identity:
              value:
                status: '401'
                code: '40100'
                title: Invalid identity
    403Forbidden:
      description: Forbidden
      headers:
        traceresponse:
          $ref: '#/components/headers/lgsTraceResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/lgsErrorResponse'
          examples:
            Invalid Entitlement:
              value:
                status: '403'
                code: '40300'
                title: Invalid Entitlement
            No Entitlement:
              value:
                status: '403'
                code: '40301'
                title: No Entitlement
            No permission to entity:
              value:
                status: '403'
                code: '40302'
                title: No permission to entity
            User not registered:
              value:
                status: '403'
                code: '40303'
                title: User not registered
            Usage limit reached:
              value:
                status: '403'
                code: '40304'
                title: Usage limit reached
            Email account not verified:
              value:
                status: '403'
                code: '40305'
                title: Email account not verified
            Token expiry too long:
              value:
                status: '403'
                code: '40306'
                title: Token expiry too long
    404NotFound:
      description: Not Found
      headers:
        traceresponse:
          $ref: '#/components/headers/lgsTraceResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/lgsErrorResponse'
          examples:
            Entity not found:
              value:
                status: '404'
                code: '40401'
                title: Entity not found
    406NotAcceptable:
      $ref: '#/components/responses/500InternalServerError'
    409Conflict:
      description: Conflict
      headers:
        traceresponse:
          $ref: '#/components/headers/lgsTraceResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/lgsErrorResponse'
          examples:
            Invalid Entitlement:
              value:
                status: '409'
                code: '40900'
                title: Entity in wrong state
    413PayloadTooLarge:
      description: Payload Too Large
      headers:
        traceresponse:
          $ref: '#/components/headers/lgsTraceResponse'
    415Unsupported:
      $ref: '#/components/responses/500InternalServerError'
    429TooManyRequests:
      description: Too Many Requests
      headers:
        traceresponse:
          $ref: '#/components/headers/lgsTraceResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/lgsErrorResponse'
          examples:
            Rate Limit Exceeded:
              value:
                status: '429'
                code: '42900'
                title: Rate limit exceeded
    500InternalServerError:
      description: Internal Server Error
      headers:
        traceresponse:
          $ref: '#/components/headers/lgsTraceResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/lgsErrorResponse'
          examples:
            Resource not found:
              value:
                status: '500'
                code: '50000'
                title: Internal server error
                messages:
                - message: Sorry, something has gone wrong whilst processing your request. An error has been logged and our support team will investigate this shortly. Please try again later and if the issue persists, please contact your Account Manager referencing the value 00-199c8ce55dc743a88661498aa8eb2cfc--00.
