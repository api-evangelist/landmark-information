  <tr>\n      <td>LPAFormsSentForSigning</td>\n      <td id=\"lpas-milestone-320\"><a href=\"#lpas-milestone-320\">320</a></td>\n    </tr>\n    <tr>\n      <td>SignedLPAFormsReceived</td>\n      <td id=\"lpas-milestone-321\"><a href=\"#lpas-milestone-321\">321</a></td>\n    </tr>\n    <tr>\n      <td>LPAsSigned</td>\n      <td id=\"lpas-milestone-322\"><a href=\"#lpas-milestone-322\">322</a></td>\n    </tr>\n    <tr>\n      <td>NoticeSent</td>\n      <td id=\"lpas-milestone-323\"><a href=\"#lpas-milestone-323\">323</a></td>\n    </tr>\n    <tr>\n      <td>LPASubmittedToOPG</td>\n      <td id=\"lpas-milestone-324\"><a href=\"#lpas-milestone-324\">324</a></td>\n    </tr>\n    <tr>\n      <td>NotificationOfSubmissionSent</td>\n      <td id=\"lpas-milestone-325\"><a href=\"#lpas-milestone-325\">325</a></td>\n    </tr>\n    <tr>\n      <td>LPAsRegistered</td>\n      <td id=\"lpas-milestone-326\"><a href=\"#lpas-milestone-326\">326</a></td>\n    </tr>\n    <tr>\n      <td>LPACopiesIssued</td>\n      <td id=\"lpas-milestone-327\"><a href=\"#lpas-milestone-327\">327</a></td>\n    </tr>\n    <tr>\n      <td>BillIssued</td>\n      <td id=\"lpas-milestone-328\"><a href=\"#lpas-milestone-328\">328</a></td>\n    </tr>\n    <tr>\n      <td>FileClosed</td>\n      <td id=\"lpas-milestone-329\"><a href=\"#lpas-milestone-329\">329</a></td>\n    </tr>\n    <tr>\n      <td>LPAExecutedDate</td>\n      <td id=\"lpas-milestone-330\"><a href=\"#lpas-milestone-330\">330</a></td>\n    </tr>\n  </tbody></table></details>\n\n<details>\n<summary>New Build Purchase</summary>\n<table>\n  <thead><tr><th>Milestone</th><th>Milestone ID</th></tr></thead>\n  <tbody>\n    <tr>\n      <td>QuoteProduced</td>\n      <td id=\"new-build-purchase-milestone-399\"><a href=\"#new-build-purchase-milestone-399\">399</a></td>\n    </tr>\n    <tr>\n      <td>DateInstructed</td>\n      <td id=\"new-build-purchase-milestone-400\"><a href=\"#new-build-purchase-milestone-400\">400</a></td>\n    </tr>\n    <tr>\n      <td>InitialCallToClientAttempted</td>\n      <td id=\"new-build-purchase-milestone-401\"><a href=\"#new-build-purchase-milestone-401\">401</a></td>\n    </tr>\n    <tr>\n      <td>InitialCallToClientCompleted</td>\n      <td id=\"new-build-purchase-milestone-402\"><a href=\"#new-build-purchase-milestone-402\">402</a></td>\n    </tr>\n    <tr>\n      <td>CareLetterSent</td>\n      <td id=\"new-build-purchase-milestone-403\"><a href=\"#new-build-purchase-milestone-403\">403</a></td>\n    </tr>\n    <tr>\n      <td>WelcomePackSent</td>\n      <td id=\"new-build-purchase-milestone-404\"><a href=\"#new-build-purchase-milestone-404\">404</a></td>\n    </tr>\n    <tr>\n      <td>VirtualFirmCredentials</td>\n      <td id=\"new-build-purchase-milestone-405\"><a href=\"#new-build-purchase-milestone-405\">405</a></td>\n    </tr>\n    <tr>\n      <td>IntroductorySMS</td>\n      <td id=\"new-build-purchase-milestone-406\"><a href=\"#new-build-purchase-milestone-406\">406</a></td>\n    </tr>\n    <tr>\n      <td>ClientIdVerified</td>\n      <td id=\"new-build-purchase-milestone-407\"><a href=\"#new-build-purchase-milestone-407\">407</a></td>\n    </tr>\n    <tr>\n      <td>ClientInfoForm</td>\n      <td id=\"new-build-purchase-milestone-408\"><a href=\"#new-build-purchase-milestone-408\">408</a></td>\n    </tr>\n    <tr>\n      <td>SignedCareLetterReceived</td>\n      <td id=\"new-build-purchase-milestone-409\"><a href=\"#new-build-purchase-milestone-409\">409</a></td>\n    </tr>\n    <tr>\n      <td>AllInitialDocumentReceived</td>\n      <td id=\"new-build-purchase-milestone-410\"><a href=\"#new-build-purchase-milestone-410\">410</a></td>\n    </tr>\n    <tr>\n      <td>SignedDeclarationReceived</td>\n      <td id=\"new-build-purchase-milestone-411\"><a href=\"#new-build-purchase-milestone-411\">411</a></td>\n    </tr>\n    <tr>\n      <td>MemoOfSaleReceived</td>\n      <td id=\"new-build-purchase-milestone-412\"><a href=\"#new-build-purchase-milestone-412\">412</a></td>\n    </tr>\n    <tr>\n      <td>ContractRequested</td>\n      <td id=\"new-build-purchase-milestone-413\"><a href=\"#new-build-purchase-milestone-413\">413</a></td>\n    </tr>\n    <tr>\n      <td>ContractReceived</td>\n      <td id=\"new-build-purchase-milestone-414\"><a href=\"#new-build-purchase-milestone-414\">414</a></td>\n    </tr>\n    <tr>\n      <td>PropInfoFormReceived</td>\n      <td id=\"new-build-purchase-milestone-415\"><a href=\"#new-build-purchase-milestone-415\">415</a></td>\n    </tr>\n    <tr>\n      <td>LeaseholdInfoFormReceived</td>\n      <td id=\"new-build-purchase-milestone-416\"><a href=\"#new-build-purchase-milestone-416\">416</a></td>\n    </tr>\n    <tr>\n      <td>FFFormReceived</td>\n      <td id=\"new-build-purchase-milestone-417\"><a href=\"#new-build-purchase-milestone-417\">417</a></td>\n    </tr>\n    <tr>\n      <td>EPCReceived</td>\n      <td id=\"new-build-purchase-milestone-418\"><a href=\"#new-build-purchase-milestone-418\">418</a></td>\n    </tr>\n    <tr>\n      <td>LocalSearchRequested</td>\n      <td id=\"new-build-purchase-milestone-419\"><a href=\"#new-build-purchase-milestone-419\">419</a></td>\n    </tr>\n    <tr>\n      <td>LocalSearchReceived</td>\n      <td id=\"new-build-purchase-milestone-420\"><a href=\"#new-build-purchase-milestone-420\">420</a></td>\n    </tr>\n    <tr>\n      <td>EnquiriesRaised</td>\n      <td id=\"new-build-purchase-milestone-421\"><a href=\"#new-build-purchase-milestone-421\">421</a></td>\n    </tr>\n    <tr>\n      <td>EnquiriesReceived</td>\n      <td id=\"new-build-purchase-milestone-422\"><a href=\"#new-build-purchase-milestone-422\">422</a></td>\n    </tr>\n    <tr>\n      <td>FurtherEnquiriesRaised</td>\n      <td id=\"new-build-purchase-milestone-423\"><a href=\"#new-build-purchase-milestone-423\">423</a></td>\n    </tr>\n    <tr>\n      <td>FurtherEnquiriesReceived</td>\n      <td id=\"new-build-purchase-milestone-424\"><a href=\"#new-build-purchase-milestone-424\">424</a></td>\n    </tr>\n