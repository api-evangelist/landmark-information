    uploadDocumentJsonRequest:
      type: object
      additionalProperties: false
      description: JSON request body for document upload. Use `multipart/form-data` to upload a file directly without encoding.
      required:
      - branchId
      - document
      anyOf:
      - required:
        - caseId
      - required:
        - externalCaseId
      properties:
        transactionId:
          $ref: '#/components/schemas/lgsUuid'
          description: Optional parent transaction from create case.
        branchId:
          $ref: '#/components/schemas/lgsUuid'
        workflowId:
          type: integer
          format: int32
          minimum: 1
          description: Optional workflow identifier.
        caseId:
          type: string
          maxLength: 50
          pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-/]*$
          description: Intelliworks case reference (e.g. `EXP-000762`).
        externalCaseId:
          type: string
          maxLength: 50
          pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-]*$
          description: External case reference (e.g. `AAR801/1`).
        taskId:
          $ref: '#/components/schemas/lgsUuid'
          description: Optional task identifier. When omitted, a new default task is created and the document is stored against it.
        document:
          $ref: '#/components/schemas/uploadDocumentJsonDocument'
    uploadDocumentJsonDocument:
      type: object
      additionalProperties: false
      description: Document metadata and content for JSON upload requests
      required:
      - fileName
      - contentType
      - extension
      properties:
        fileName:
          type: string
          maxLength: 255
          pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-/.,']*$
        description:
          type: string
          maxLength: 500
          pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-/.,' ]*$
        contentBase64:
          type: string
          minLength: 1
          description: Optional Base64-encoded document content. Prefer `multipart/form-data` to upload the file directly.
        contentType:
          $ref: '#/components/schemas/uploadDocumentAllowedContentType'
        extension:
          $ref: '#/components/schemas/uploadDocumentAllowedExtension'
    uploadDocumentAllowedContentType:
      type: string
      enum:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain
      - image/png
      - image/jpeg
    uploadDocumentAllowedExtension:
      type: string
      enum:
      - pdf
      - doc
      - docx
      - txt
      - png
      - jpg
      - jpeg
    uploadDocumentResponse:
      type: object
      additionalProperties: false
      description: Accepted document upload response
      required:
      - transactionRequestId
      - transactionId
      - documentId
      properties:
        transactionRequestId:
          $ref: '#/components/schemas/lgsUuid'
        transactionId:
          $ref: '#/components/schemas/lgsUuid'
        documentId:
          $ref: '#/components/schemas/lgsUuid'
    completedDocumentsResponse:
      type: object
      additionalProperties: false
      title: Completed documents
      description: Read-only list of completed documents returned by Get Completed Documents.
      properties:
        caseId:
          type: string
          maxLength: 50
          pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-/]*$
          description: Intelliworks case reference.
        externalCaseId:
          type: string
          maxLength: 50
          pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-/]*$
          description: External case reference from the originating system.
        workflowId:
          type: integer
          format: int32
          minimum: 0
          maximum: 99999
          description: Intelliworks workflow identifier.
        documents:
          type: array
          description: Completed documents held against the case.
          items:
            $ref: '#/components/schemas/completedDocumentItem'
    completedDocumentItem:
      type: object
      additionalProperties: false
      title: Completed document
      description: A single completed document held against a case.
      properties:
        id:
          type: string
          format: uuid
          description: Document ID. Use this value with `GET /documents/{id}/download` to download the document.
        description:
          type: string
          maxLength: 255
          description: Document description.
        fileName:
          type: string
          maxLength: 255
          description: Resolved document file name.
        extension:
          type: string
          maxLength: 25
          description: File extension.
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          description: Document size in bytes.
        externalType:
          type: string
          maxLength: 50
          description: Document classification (e.g. CaseDocument, CaseImport).
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (UTC).
        updatedAt:
          type: string
          format: date-time
          description: Last updated timestamp (UTC).
    Error:
      required:
      - code
      - message
      additionalProperties: false
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
          pattern: ^.*$
    lgsUuid:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[4][0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$
    lgsUprn:
      type: integer
      format: int64
      minimum: 0
      maximum: 9223372036854775000
    lgsAddressPAF:
      $comment: Based https://www.poweredbypaf.com/wp-content/uploads/2017/07/Latest-Programmers_guide_Edition-7-Version-6.pdf. Addresses defined in PAF are designed to be applicable properties that recieve mail.
      type: object
      required:
      - addressType
      properties:
        addressType:
          type: string
          enum:
          - addressPAF
        uprn:
          $ref: '#/components/schemas/lgsUprn'
        udprn:
          type: integer
          description: Royal Mail’s Unique Delivery Point Reference Number (UDPRN)
          minimum: 0
          maximum: 99999999
        departmentName:
          type: string
          description: 'example: Customer Service Department'
          maxLength: 60
          pattern: ^(?!(&lt;[^&gt;].*&gt;|%3c[^%3e].*%3e|<[^>].*>)).*$
        organisationName:
          type: string
          description: 'example: JW Simpsons Ltd'
          maxLength: 60
          pattern: ^(?!(&lt;[^&gt;].*&gt;|%3c[^%3e].*%3e|<[^>].*>)).*$
        subBuildingName:
          type: string
          description: 'example: The Old Mill'
          maxLength: 30
          pattern: ^(?!(&lt;[^&gt;].*&gt;|%3c[^%3e].*%3e|<[^>].*>)).*$
        buildingName:
          type: string
          description: 'example: The Annexe'
          maxLength: 50
          pattern: ^(?!(&lt;[^&gt;].*&gt;|%3c[^%3e].*%3e|<[^>].*>)).*$
        buildingNumber:
          type: string
          description: 'example: 7'
          maxLength: 4
          pattern: ^[A-Za-z0-9-/\s]*$
        poBoxNumber:
          type: string
          description: 'example: 5422'
          maxLength: 14
          pattern: ^[A-Za-z0-9.#\s]*$
        dependentThoroughfare:
          type: string
          description: 'example: Richmond Terrace'
          maxLength: 60
          pattern: ^[A-Za-zÀ-ž0-9\u2010-\u201F-.,'&\s]*$
        thoroughfare:
          type: string
          description: 'example: Main Street'
          maxLength: 60
          pattern: ^[A-Za-zÀ-ž0-9\u2010-\u201F-.,'&\s]*$
        doubleDependentLocality:
          type: string
          description: 'example: Hook'
          maxLength: 35
          pattern: ^[A-Za-zÀ-ž0-9\u2010-\u201F-.,'&\s]*$
        dependentLocality:
          type: string
          description: 'example: Warsash'
          maxLength: 35
          pattern: ^[A-Za-zÀ-ž0-9\u2010-\u201F-.,'&\s]*$
        postTown:
          type: string
          description: 'example: Southampton'
          maxLength: 30
          pattern: ^[A-Za-zÀ-ž\u2010-\u201F-.'&!\s]*$
        postcode:
          type: string
          description: 'example: SO99 9ZZ'
          maxLength: 10
          pattern: ^[A-Za-z0-9\s]*$
        blpuEasting:
          type: number
          description: 'example: 296701'
        blpuNorthing:
          type: number
          description: 'example: 92288'
    lgsAddressBS7666:
      $comment: BS7666 no longer includes field lengths, however, field lengths included to conform to Landmark Standard 2.5.1. Addresses defined in BS 7666 are designed to be applicable to land and property, not just properties that recieve mail.
      type: object
      required:
      - addressType
      - postcodeLocator
      properties:
        addressType:
          type: string
          enum:
          - addressBS7666
        uprn:
          $ref: '#/components/schemas/lgsUprn'
        organisation:
          type: string
          description: 'example: JW Simpson Ltd'
          maxLength: 60
          pattern: ^.*$
        saoText:
          type: string
          description: 'example: The Annexe'
          maxLength: 90
          pattern: ^.*$
        saoStartNumber:
          type: integer
          description: 'example: 1'
        saoStartSuffix:
          type: string
          description: 'example: A'
          maxLength: 2
          pattern: ^.*$
        saoEndNumber:
          type: integer
          description: 'example: 5'
        saoEndSuffix:
          type: string
          description: 'example: C'
          maxLength: 2
          pattern: ^.*$
        paoText:
          type: string
          description: 'example: The Old Mill'
          maxLength: 90
          pattern: ^.*$
        paoStartNumber:
          type: integer
          description: 'example: 7'
        paoStartSuffix:
          type: string
          description: 'example: A'
          maxLength: 2
          pattern: ^.*$
        paoEndNumber:
          type: integer
          description: 'example: 9'
        paoEndSuffix:
          type: string
          description: 'example: C'
          maxLength: 2
          pattern: ^.*$
        streetDescription:
          type: string
          description: 'example: Main Street'
          maxLength: 100
          pattern: ^.*$
        locality:
          type: string
          description: 'example: Hook'
          maxLength: 35
          pattern: ^.*$
        townName:
          type: string
          description: 'example: Warsash'
          maxLength: 30
          pattern: ^.*$
        administrativeArea:
          type: string
          description: 'example: Southampton'
          maxLength: 30
          pattern: ^.*$
        postcodeLocator:
          type: string
          description: 'example: SO99 9ZZ'
          maxLength: 10
          pattern: ^.*$
        blpuEasting:
          type: number
          description: 'example: 296701'
        blpuNorthing:
          type: number
          description: 'example: 92288'
    lgsAddressSingleLine:
      $comment: Singleline is suitable for those applications where a structured address is not required.
      type: object
      required:
      - addressType
      - addressLine
      properties:
        addressType:
          type: string
          enum:
          - addressSingleLine
        uprn:
          $ref: '#/components/schemas/lgsUprn'
        addressLine:
          type: string
          description: 'example: The Old Mill, 7A-9 Main Street, Hook, Warsash, Southampton, SO99 9ZZ'
          maxLength: 1000
          pattern: ^.*$
    lgsAddress9Line:
      $comment: 9Line is suitable for those applications where a structured address is required but flexibility around the address elements is desired.
      type: object
      required:
      - addressType
      - addressLine1
      - addressLine2
      properties:
        addressType:
          type: string
          enum:
          - address9Line
        uprn:
          $ref: '#/components/schemas/lgsUprn'
        addressLine1:
          type: string
          description: 'example: The Old Mill'
          maxLength: 200
          pattern: ^.*$
        addressLine2:
          type: string
          description: 'example: 7-9 Main Street'
          maxLength: 200
          pattern: ^.*$
        addressLine3:
          type: string
          description: 'example: Hook'
          maxLength: 200
          pattern: ^.*$
        addressLine4:
          type: string
          description: 'example: Warsash'
          maxLength: 200
          pattern: ^.*$
        addressLine5:
          type: string
          description: 'example: Southampton'
          maxLength: 200
          pattern: ^.*$
        addressLine6:
          type: string
          description: 'example: Hampshire'
          maxLength: 200
          pattern: ^.*$
        addressLine7:
          type: string
          description: 'example: England'
          maxLength: 200
          pattern: ^.*$
        addressLine8:
          type: string
          description: 'example: United Kingdom'
          maxLength: 200
          pattern: ^.*$
        addressLine9:
          type: string
          description: 'example: SO99 9ZZ'
          maxLength: 200
          pattern: ^.*$
    lgsAddressFixedLine:
      $comment: FixedLine is suitable for those applications where a user friendly, structured address is required.
      type: object
      required:
      - addressType
      - postcode
      properties:
        addressType:
          type: string
          enum:
          - addressFixedLine
        uprn:
          $ref: '#/components/schemas/lgsUprn'
        name:
          type: string
          maxLength: 200
          pattern: ^.*$
        number:
          type: string
          maxLength: 200
          pattern: ^.*$
        street:
          type: string
          description: 'example: 7-9 Main Street'
          maxLength: 200
          pattern: ^.*$
        area:
          type: string
          description: 'example: Hook'
          maxLength: 200
          pattern: ^.*$
        town:
          type: string
          description: 'example: Warsash'
          maxLength: 200
          pattern: ^.*$
        county:
          type: string
          description: 'example: Hampshire'
          maxLength: 200
          pattern: ^.*$
        country:
          type: string
          description: 'example: England'
          maxLength: 200
          pattern: ^.*$
        postcode:
          type: string
          description: 'example: SO99 9ZZ'
          maxLength: 10
          pattern: ^.*$
    lgsAddressUprnOnly:
      $comment: UprnOnly is suitable when client or application has a valid uprn. If an address is required an address match will need to be made.
      type: object
      required:
      - addressType
      - uprn
      properties:
        addressType:
          type: string
          enum:
          - addressUprnOnly
        uprn:
          $ref: '#/components/schemas/lgsUprn'
    lgsAddressAddressBaseCore:
      $comment: Based https://www.ordnancesurvey.co.uk/documents/product-support/tech-spec/addressbasecore-technical-specification.pdf.
      type: object
      required:
      - addressType
      properties:
        addressType:
          type: string
          enum:
          - addressAddressBaseCore
        uprn:
          $ref: '#/components/schemas/lgsUprn'
        parentUprn:
          $ref: '#/components/schemas/lgsUprn'
        udprn:
          type: integer
          description: Royal Mail’s Unique Delivery Point Reference Number (UDPRN)
          minimum: 0
          maximum: 99999999
        usrn:
          type: integer
          description: Unique Street Reference Number assigned by the Street Name and Numbering Custodian OR Ordnance Survey depending on the address record
          minimum: 0
          maximum: 99999999
        toid:
          type: string
          description: The Topographic Identifier taken from OS MasterMap Topography Layer
          maxLength: 20
          pattern: ^.*$
        easting:
          type: number
          description: A value in metres defining the x location in accordance with the British National Grid
        northing:
          type: number
          description: A value in metres defining the y location in accordance with the British National Grid
        latitude:
          type: number
          description: A value defining the Latitude location in accordance with the ETRS89 coordinate reference system
        longitude:
          type: number
          description: A value defining the Longitude location in accordance with the ETRS89 coordinate reference system
        singleLineAddress:
          type: string
          description: A single attribute containing text concatenation of the address elements separated by a comma
          maxLength: 500
          pattern: ^.*$
        poBox:
          type: string
          description: Text concatenation of PO BOX and the Post Office Box (PO Box) number or ‘BFPO’ and the British Forces Post Office number
          maxLength: 13
          pattern: ^.*$
        organisation:
          type: string
          description: 'The organisation name is the business name given, when appropriate, to an address record. '
          maxLength: 100
          pattern: ^.*$
        subBuilding:
          type: string
          description: The sub-building name and/or number for the address record
          maxLength: 110
          pattern: ^.*$
        buildingName:
          type: string
          description: The building name is a description applied to a single address or a group of addresses
          maxLength: 110
          pattern: ^.*$
        buildingNumber:
          type: string
          description: The building number is a number or range of numbers given to a single address or a group of addresses
          maxLength: 13
          pattern: ^.*$
        streetName:
          type: string
          description: Street / Road name for the address record
          maxLength: 100
          pattern: ^.*$
        locality:
          type: string
          description: A locality defines an area or geographical identifier within a town, village or hamlet. Locality represents the lower level geographical area.
          maxLength: 35
          pattern: ^.*$
        townName:
          type: string
          description: Geographical town name assigned by the Local Authority. Please note this can be different from the Post Town value assigned by Royal Mail
          maxLength: 35
          pattern: ^.*$
        postTown:
          type: string
          description: The town or city in which the Royal Mail sorting office is located which services this address record
          maxLength: 30
          pattern: ^.*$
        island:
          type: string
          description: Third level of geographic area name to record island names where appropriate
          maxLength: 50
          pattern: ^.*$
        postcode:
          type: string
          description: A postcode assigned by Royal Mail for the address record
          maxLength: 8
          pattern: ^.*$
    lgsAddress:
      oneOf:
      - $ref: '#/components/schemas/lgsAddressPAF'
      - $ref: '#/components/schemas/lgsAddressBS7666'
      - $ref: '#/components/schemas/lgsAddressSingleLine'
      - $ref: '#/components/schemas/lgsAddress9Line'
      - $ref: '#/components/schemas/lgsAddressFixedLine'
      - $ref: '#/components/schemas/lgsAddressUprnOnly'
      - $ref: '#/components/schemas/lgsAddressAddressBaseCore'
    lgsPerson:
      type: object
      additionalProperties: true
      properties:
        id:
          $comment: Unique person id
          $ref: '#/components/schemas/lgsUuid'
        title:
          type: string
          maxLength: 20
          pattern: ^.{0}$|^(?=.*[A-Za-zÀ-ÖØ-öø-ž])[A-Za-zÀ-ÖØ-öø-ž'. -]*$
        firstName:
          type: string
          maxLength: 100
          pattern: ^.{0}$|^(?=.*[A-Za-zÀ-ÖØ-öø-ž])[A-Za-zÀ-ÖØ-öø-ž\u2010-\u2015‘’‛.' -]*$
        middleName:
          type: string
          maxLength: 100
          pattern: ^.{0}$|^(?=.*[A-Za-zÀ-ÖØ-öø-ž])[A-Za-zÀ-ÖØ-öø-ž\u2010-\u2015‘’‛.' -]*$
        lastName:
          type: string
          maxLength: 100
          pattern: ^(?=.*[A-Za-zÀ-ÖØ-öø-ž])[A-Za-zÀ-ÖØ-öø-ž\u2010-\u2015‘’‛.' -]*$
        email:
          $comment: Email format based on https://datatracker.ietf.org/doc/html/rfc3696#section-3
          type: string
          format: email
          maxLength: 320
        telephoneNumber:
          $comment: Limits set inline with https://en.wikipedia.org/wiki/E.164
          type: string
          minLength: 8
          maxLength: 15
        mobileTelephoneNumber:
          $comment: 'Limits set inline with https://en.wikipedia.org/wiki/E.164, ideally this should be used when it is known that the number relates to a mobile number or when there is already a value in the telephoneNumber  '
          type: string
          minLength: 8
          maxLength: 15
        address:
          description: Main residential address
          $ref: '#/components/schemas/lgsAddress'
        correspondenceAddress:
          description: Alternative address for correspondence
          $ref: '#/components/schemas/lgsAddress'
      required:
      - lastName
    lgsErrorResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - code
      - title
      properties:
        status:
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[0-9]{3}$
        code:
          type: string
          minLength: 5
          maxLength: 5
          pattern: ^[0-9]{5}$
        title:
          type: string
          minLength: 1
          maxLength: 100
        messages:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
            - message
            properties:
              property:
                type: string
                minLength: 1
                maxLength: 1000
              message:
                type: string
                minLength: 1
                maxLength: 1000
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    lgsTraceResponse:
      description: Trace context providing an unique identifier for an individual requests
      schema:
        type: string
        minLength: 39
        maxLength: 39
        pattern: ^[0-9a-fA-F]{2}-[0-9a-fA-F]{32}--[0-9a-fA-F]{2}$
      examples:
        Example traceresponse:
          value: 00-199c8ce55dc743a88661498aa8eb2cfc--00
security:
- bearerAuth: []
