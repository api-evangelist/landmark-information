d=\"sale-milestone-138\"><a href=\"#sale-milestone-138\">138</a></td>\n    </tr>\n    <tr>\n      <td>ClientCompletionStatement</td>\n      <td id=\"sale-milestone-139\"><a href=\"#sale-milestone-139\">139</a></td>\n    </tr>\n    <tr>\n      <td>ActualExchange</td>\n      <td id=\"sale-milestone-140\"><a href=\"#sale-milestone-140\">140</a></td>\n    </tr>\n    <tr>\n      <td>ContractualCompletion</td>\n      <td id=\"sale-milestone-141\"><a href=\"#sale-milestone-141\">141</a></td>\n    </tr>\n    <tr>\n      <td>ActualCompletion</td>\n      <td id=\"sale-milestone-142\"><a href=\"#sale-milestone-142\">142</a></td>\n    </tr>\n    <tr>\n      <td>SatisfactionQuestionnaireSent</td>\n      <td id=\"sale-milestone-143\"><a href=\"#sale-milestone-143\">143</a></td>\n    </tr>\n    <tr>\n      <td>CaseClosed</td>\n      <td id=\"sale-milestone-144\"><a href=\"#sale-milestone-144\">144</a></td>\n    </tr>\n    <tr>\n      <td>DateAborted</td>\n      <td id=\"sale-milestone-145\"><a href=\"#sale-milestone-145\">145</a></td>\n    </tr>\n    <tr>\n      <td>EnquiriesReceived</td>\n      <td id=\"sale-milestone-146\"><a href=\"#sale-milestone-146\">146</a></td>\n    </tr>\n    <tr>\n      <td>EnquiriesToClient</td>\n      <td id=\"sale-milestone-147\"><a href=\"#sale-milestone-147\">147</a></td>\n    </tr>\n    <tr>\n      <td>RedStatsReceived</td>\n      <td id=\"sale-milestone-148\"><a href=\"#sale-milestone-148\">148</a></td>\n    </tr>\n    <tr>\n      <td>FinalRedStatsReceived</td>\n      <td id=\"sale-milestone-149\"><a href=\"#sale-milestone-149\">149</a></td>\n    </tr>\n    <tr>\n      <td>FinalRedStatsRequested</td>\n      <td id=\"sale-milestone-150\"><a href=\"#sale-milestone-150\">150</a></td>\n    </tr>\n    <tr>\n      <td>TitleInformationRequested</td>\n      <td id=\"sale-milestone-201\"><a href=\"#sale-milestone-201\">201</a></td>\n    </tr>\n    <tr>\n      <td>TitleInformationReceived</td>\n      <td id=\"sale-milestone-202\"><a href=\"#sale-milestone-202\">202</a></td>\n    </tr>\n    <tr>\n      <td>InitialCallToClientAttempted</td>\n      <td id=\"sale-milestone-479\"><a href=\"#sale-milestone-479\">479</a></td>\n    </tr>\n    <tr>\n      <td>WelcomePackSent</td>\n      <td id=\"sale-milestone-480\"><a href=\"#sale-milestone-480\">480</a></td>\n    </tr>\n    <tr>\n      <td>FFFormSent</td>\n      <td id=\"sale-milestone-481\"><a href=\"#sale-milestone-481\">481</a></td>\n    </tr>\n    <tr>\n      <td>AllRepliesToEnquiriesAnswered</td>\n      <td id=\"sale-milestone-482\"><a href=\"#sale-milestone-482\">482</a></td>\n    </tr>\n    <tr>\n      <td>BuyersConveyancerSatisfiedWithReplies</td>\n      <td id=\"sale-milestone-483\"><a href=\"#sale-milestone-483\">483</a></td>\n    </tr>\n    <tr>\n      <td>SignedTransferReceived</td>\n      <td id=\"sale-milestone-484\"><a href=\"#sale-milestone-484\">484</a></td>\n    </tr>\n    <tr>\n      <td>BankruptcySearchSubmitted</td>\n      <td id=\"sale-milestone-485\"><a href=\"#sale-milestone-485\">485</a></td>\n    </tr>\n    <tr>\n      <td>DateAbortedInterim</td>\n      <td id=\"sale-milestone-486\"><a href=\"#sale-milestone-486\">486</a></td>\n    </tr>\n  </tbody></table></details>\n\n<details>\n<summary>Wills</summary>\n<table>\n  <thead><tr><th>Milestone</th><th>Milestone ID</th></tr></thead>\n  <tbody>\n    <tr>\n      <td>FileOpened</td>\n      <td id=\"wills-milestone-332\"><a href=\"#wills-milestone-332\">332</a></td>\n    </tr>\n    <tr>\n      <td>ClientCareLetterSent</td>\n      <td id=\"wills-milestone-333\"><a href=\"#wills-milestone-333\">333</a></td>\n    </tr>\n    <tr>\n      <td>SignedCareLetterReceived</td>\n      <td id=\"wills-milestone-334\"><a href=\"#wills-milestone-334\">334</a></td>\n    </tr>\n    <tr>\n      <td>ClientsIDVerified</td>\n      <td id=\"wills-milestone-335\"><a href=\"#wills-milestone-335\">335</a></td>\n    </tr>\n    <tr>\n      <td>WillQuestionnairePrepared</td>\n      <td id=\"wills-milestone-336\"><a href=\"#wills-milestone-336\">336</a></td>\n    </tr>\n    <tr>\n      <td>WillQuestionnaireReceived</td>\n      <td id=\"wills-milestone-337\"><a href=\"#wills-milestone-337\">337</a></td>\n    </tr>\n    <tr>\n      <td>PreviousWillRequested</td>\n      <td id=\"wills-milestone-338\"><a href=\"#wills-milestone-338\">338</a></td>\n    </tr>\n    <tr>\n      <td>PreviousWillReceived</td>\n      <td id=\"wills-milestone-339\"><a href=\"#wills-milestone-339\">339</a></td>\n    </tr>\n    <tr>\n      <td>InitialMeetingAttendanceNotePrepared</td>\n      <td id=\"wills-milestone-341\"><a href=\"#wills-milestone-341\">341</a></td>\n    </tr>\n    <tr>\n      <td>DraftWillPrepared</td>\n      <td id=\"wills-milestone-342\"><a href=\"#wills-milestone-342\">342</a></td>\n    </tr>\n    <tr>\n      <td>DoctorsCapacityReportRequested</td>\n      <td id=\"wills-milestone-343\"><a href=\"#wills-milestone-343\">343</a></td>\n    </tr>\n    <tr>\n      <td>DoctorsCapacityReportReceived</td>\n      <td id=\"wills-milestone-344\"><a href=\"#wills-milestone-344\">344</a></td>\n    </tr>\n    <tr>\n      <td>SeveranceOfJointTenancyApplicationPrepared</td>\n      <td id=\"wills-milestone-345\"><a href=\"#wills-milestone-345\">345</a></td>\n    </tr>\n    <tr>\n      <td>NoticeOfSeveranceOfJointTenancyPrepared</td>\n      <td id=\"wills-milestone-346\"><a href=\"#wills-milestone-346\">346</a></td>\n    </tr>\n    <tr>\n      <td>FeeEarnerRiskManagementReview</td>\n      <td id=\"wills-milestone-347\"><a href=\"#wills-milestone-347\">347</a></td>\n    </tr>\n    <tr>\n      <td>CaseLockedDownRiskConcerns</td>\n      <td id=\"wills-milestone-348\"><a href=\"#wills-milestone-348\">348</a></td>\n    </tr>\n    <tr>\n      <td>CaseUnlocked</td>\n      <td id=\"wills-milestone-349\"><a href=\"#wills-milestone-349\">349</a></td>\n    </tr>\n    <tr>\n      <td>WillSentForExecutionWithoutSupervision</td>\n      <td id=\"wills-milestone-350\"><a href=\"#wills-milestone-350\">350</a></td>\n    </tr>\n    <tr>\n      <td>MeetingWithClientForWillExecution</td>\n      <td id=\"wills-milestone-351\"><a href=\"#wills-milestone-351\">351</a></td>\n    </tr>\n    <tr>\n      <td>WillExecuted</td>\n      <td id=\"wills-milestone-352\"><a href=\"#wills-milestone-352\">352</a></td>\n    </tr>\n    <tr>\n      <td>ExecutedWillReceivedForStorage</td>\n      <td id=\"wills-milestone-353\"><a href=\"#wills-milestone-353\">353</a></td>\n    </tr>\n    <tr>\n      <td>DateClosed</td>\n      <td id=\"wills-milestone-354\"><a href=\"#wills-milestone-354\">354</a></td>\n    </tr>\n    <tr>\n      <td>DraftWillApproved</td>\n      <td id=\"wills-milestone-355\"><a href=\"#wills-milestone-355\">355</a></td>\n    </tr>\n    <tr>\n      <td>DraftWillSentForApproval</td>\n      <td id=\"wills-milestone-356\"><a href=\"#wills-milestone-356\">356</a></td>\n    </tr>\n  </tbody></table></details>\n\n### Asynchronous processing and status notifications\n\nSeveral endpoints, including create/update case, create/update task, create/update milestone, and upload document, are processed asynchronously. Each accepted request returns a `transactionRequestId` that you use to track progress.\n\nYou can receive status in either of the following ways:\n\n**1. Poll transaction status**\n\nCall `GET /transaction-requests/{transactionRequestId}`. See [Get transaction request status](#get-transaction-request-status) for supported `status` values.\n\n**2. Webhook callback (optional)**\n\nOptionally include a callback URL on the request. When processing completes, the Experience API sends an HTTP `POST` to that URL with the same status response.\n\nIf you use webhooks, tell Ochresoft in advance how your callback endpoint should be authenticated so we can configure it for your integration.\n\n### Create or update task\n\nCreate or update an **unscheduled** task on an existing Intelliworks case. Intelliworks is workflow-driven: scheduled workflow tasks cannot be created through this API. Only the unscheduled task combinations listed in [Supported unscheduled task mappings](#supported-unscheduled-task-mappings) are valid.\n\n* **Create** - omit `clientTaskId`; a new identifier is returned in the response.\n* **Update** - supply the `clientTaskId` returned from the original create response.\n* At least one of `caseId` or `externalCaseId` is required.\n* `completionDate` is mandatory when `status` is `Closed`.\n\nRequests that use a `processReference`, `taskReference`, and `taskType` combination outside the supported mapping may be rejected with an error, or the task may be created in Intelliworks but not function correctly in the workflow.\n\n<a id=\"supported-unscheduled-task-mappings\"></a>\nSupported unscheduled task mappings:\n\n<table>\n  <thead><tr><th>Task name</th><th>Process reference (Pref)</th><th>Task reference</th><th>Task type</th></tr></thead>\n  <tbody>\n    <tr><td>ATTACHMAIL</td><td>USP</td><td>MAIL2</td><td>Email</td></tr>\n    <tr><td>CDATAIMPORT</td><td>USP</td><td>IMPORTCASEDATA</td><td>Import</td></tr>\n    <tr><td>CLONEDCONTENT_EXTERNAL_ACCOUNTSTRANSACTION_ADDED</td><td>USP</td><td>SYST09</td><td>Query</td></tr>\n    <tr><td>CLONEDCONTENT_FAX</td><td>USP</td><td>SYST06</td><td>Fax</td></tr>\n    <tr><td>CLONEDCONTENT_IMPORT</td><td>USP</td><td>SYST04</td><td>Import</td></tr>\n    <tr><td>CLONEDCONTENT_SCANNER</td><td>USP</td><td>SYST05</td><td>Scanner</td></tr>\n    <tr><td>CLONEDCONTENT_VF_MESSAGE</td><td>USP</td><td>SYST08</td><td>VirtualFirmMessage</td></tr>\n    <tr><td>FAXIMPORT</td><td>USP</td><td>SYST07</td><td>Fax</td></tr>\n    <tr><td>IMPORTFILE</td><td>USP</td><td>IMPF1</td><td>Import</td></tr>\n    <tr><td>IMPORTSCAN</td><td>USP</td><td>IMPORTSCAN</td><td>Import</td></tr>\n    <tr><td>MULTI_EMAIL_IMPORT</td><td>USP</td><td>MAIL3</td><td>Action</td></tr>\n    <tr><td>SCANNERIMPORT</td><td>USP</td><td>SYST01</td><td>Scanner</td></tr>\n    <tr><td>SENDMAIL</td><td>USP</td><td>MAIL1</td><td>Email</td></tr>\n  </tbody>\n</table>\n\nMap `processReference` to **Pref**, `taskReference` to **Task reference**, and `taskType` to **Task type**. Use the **Task name** value as the task `description` unless your integration agreement specifies otherwise.\n\n### Create or update milestone\n\nSet or update milestone actual and/or forecast dates for a case. Supply `branchId`, at least one of `caseId` or `externalCaseId`, and one or more milestones. Valid `milestoneId` values are listed in [Supported milestone IDs by workflow](#supported-milestone-ids).\n\n### Upload document\n\nUpload a document against an Intelliworks case. A document can be uploaded as part of an `IMPORTFILE` task.\n\n### List case documents\n\nReturns the list of completed documents held against a case in Intelliworks for the specified branch. Supply at least one of `caseId` (Intelliworks case reference, e.g. `EXP-000762`) and/or `externalCaseId` (e.g. `AAR801/1`). Each document in the response can be downloaded using the Download document endpoint (`GET /documents/{id}/download`).\n\n### Download document\n\nDownloads a document by document ID (as returned in the List case documents response).\n\n<a id=\"get-transaction-request-status\"></a>\n### Get transaction request status\n\nReturns the latest processing status for any asynchronous Experience API request identified by `transactionRequestId`.\n\nSupported `status` values:\n\n* `Accepted`\n* `Queued`\n* `Processing`\n* `Completed`\n* `Failed`\n\nPoll `GET /transaction-requests/{transactionRequestId}` until `status` is `Completed` or `Failed`.\n\n\n# Endpoints\nThe API is accessed by making HTTPS requests to an endpoint URL.\nEvery endpoint is accessed only via the SSL-enabled HTTPS (port 443) protocol.\nThe API uses semantic versioning, and the current release is v1.0.0\n\n# Environments\nThe API is available in two environments, both are identical in that they have the same specification infrastructure and functionality.\n\nThe 2 environments are:\n* User Acceptance Testing (UAT)\n* Production (PRD)\n\n## UAT\nThe UAT environment should be used during development, and interfaces with the Intelliworks UAT environment.\nYou should use this whilst implementing and testing your integration.\n\nThe URLs for the UAT APIs are:\n* Base URL: https://uat-api.landmarkcloudservices.com/intelliworks/experience\n* Auth: https://lmkmaster.eu.auth0.com/oauth/token\n\n## PRD\nThe PRD environment is a live instance, and this talks to the live Intelliworks environment.\nThis should only be used once the integration is considered production ready and all testing has been completed on the UAT environment.\nAny actions performed on PRD will result in the creation and syncing of real data that may be seen by users.\n\nThe URLs for the production APIs are:\n* Base URL: https://api.landmarkcloudservices.com/intelliworks/experience\n* Auth: https://lmkmaster.eu.auth0.com/oauth/token\n\n# Requests & Authentication\nRequests must be sent over HTTPS with any payload formatted in JSON. To authenticate against the API a Bearer Token Header must be provided.\n\n# Rate limiting\nThe API allows a maximum of 250 requests per customer per minute.\n"
