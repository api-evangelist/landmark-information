info:
  version: 2.3.0
  title: Intelliworks APIs
  description: "The purpose of the Intelliworks Create Case API is to enable Case creation from outside Intelliworks environment, and to unlock a more efficient process for users, by reducing manual data entry.\n\nAny action performed via the API will be visible in the Intelliworks UI, and the further action can be performed either in the UI or via the API. The intent is to ensure data accuracy between applications, avoiding the need to re-key information. This is primarily a technical pack intended for developers. It will provide an explanation of the service, the calls involved and some sample requests.\n\n# Overview\n\nThis current released version of the API pack enables:\n\n## Cases\n### Create new case\n\nYou can create new cases via the API for the following types;\n\n<table>\n  <thead>\n    <tr>\n      <th>Workflow type</th>\n      <th>Workflow ID</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Sale</td>\n      <td>220-Sale</td>\n    </tr>\n    <tr>\n      <td>Purchase</td>\n      <td>210-Purchase</td>\n    </tr>\n    <tr>\n      <td>New build purchase</td>\n      <td>216-New Build Purchase</td>\n    </tr>\n    <tr>\n      <td>General Property</td>\n      <td>10200-General Property</td>\n    </tr>\n    <tr>\n      <td>Remortgage</td>\n      <td>300-Remortgage</td>\n    </tr>\n    <tr>\n      <td>Equity release</td>\n      <td>360-Equity Release (360)</td>\n    </tr>\n    <tr>\n      <td>Transfer of Equity</td>\n      <td>700-Transfer of Equity</td>\n    </tr>\n    <tr>\n      <td>Wills</td>\n      <td>415-Wills</td>\n    </tr>\n    <tr>\n      <td>Lasting Power of Attorney</td>\n      <td>500-Lasting Power of Attorney</td>\n    </tr>\n    <tr>\n      <td>Probate</td>\n      <td>601-Probate</td>\n    </tr>\n  </tbody>\n</table>\n\nIt provides the option to create a new case, via the API, instead of by manually initiating the case from the Intelliworks user interface. A case in Intelliworks consists of key details such as clients, a descriptive summary, and the type of case. For conveyancing cases, it also includes property, and price agreed. When you create a case, you need to include the appropriate WorkflowID for the type of case you want to create\n\nThe branch ID is a unique ID created by Ochresoft. Each branch ID relates to a branch or site (office) of the customer. When you create a case via API, you must specify which branch the case should be created in by including the branch ID. For example, if the customer has an Oxford office with branch ID \"926a95j1-c120-4cfd-80dd-9572c99345a6\", you will need to send that ID in the message. If you haven't already got the branch IDs for the customer, request them from Ochresoft.\n\nOnce the case is created, the workflow operates in the same way as if the case had been created manually, ensuring the conveyancer is guided through the process, but without the need to re-key details already held in another application.\n\n### Update case\n\nYou can update an existing Intelliworks case via the API using the same workflow-specific request body as create case. Supply the parent `transactionId` from the original create case response when updating case details.\n\n### Get case\n\nRetrieve read-only case summary details from Intelliworks by branch and either an Intelliworks case reference (`caseId`) and/or an external case reference (`externalCaseId`). At least one of `caseId` or `externalCaseId` must be supplied.\n\n### Get milestone\n\nReturns the actual completion date of a milestone for a case. Supply `branchId`, `milestoneId`, and at least one of `caseId` or `externalCaseId`. Optionally include `workflowId` when required for the target workflow. Valid `milestoneId` values are listed in [Supported milestone IDs by workflow](#supported-milestone-ids).\n\n<a id=\"supported-milestone-ids\"></a>\nSupported milestone IDs by workflow:\n\n<details>\n<summary>Gen. Priv. Cli.</summary>\n<table>\n  <thead><tr><th>Milestone</th><th>Milestone ID</th></tr></thead>\n  <tbody>\n    <tr>\n      <td>FileOpened</td>\n      <td id=\"gen-priv-cli-milestone-499\"><a href=\"#gen-priv-cli-milestone-499\">499</a></td>\n    </tr>\n    <tr>\n      <td>ClientCareLetterSent</td>\n      <td id=\"gen-priv-cli-milestone-500\"><a href=\"#gen-priv-cli-milestone-500\">500</a></td>\n    </tr>\n    <tr>\n      <td>SignedClientCareLetterReceived</td>\n      <td id=\"gen-priv-cli-milestone-501\"><a href=\"#gen-priv-cli-milestone-501\">501</a></td>\n    </tr>\n    <tr>\n      <td>ClientsIDVerified</td>\n      <td id=\"gen-priv-cli-milestone-502\"><a href=\"#gen-priv-cli-milestone-502\">502</a></td>\n    </tr>\n    <tr>\n      <td>FileReview1</td>\n      <td id=\"gen-priv-cli-milestone-503\"><a href=\"#gen-priv-cli-milestone-503\">503</a></td>\n    </tr>\n    <tr>\n      <td>FileReview2</td>\n      <td id=\"gen-priv-cli-milestone-504\"><a href=\"#gen-priv-cli-milestone-504\">504</a></td>\n    </tr>\n    <tr>\n      <td>FileReview3</td>\n      <td id=\"gen-priv-cli-milestone-505\"><a href=\"#gen-priv-cli-milestone-505\">505</a></td>\n    </tr>\n    <tr>\n      <td>FileReview4</td>\n      <td id=\"gen-priv-cli-milestone-506\"><a href=\"#gen-priv-cli-milestone-506\">506</a></td>\n    </tr>\n    <tr>\n      <td>FileReview5</td>\n      <td id=\"gen-priv-cli-milestone-507\"><a href=\"#gen-priv-cli-milestone-507\">507</a></td>\n    </tr>\n    <tr>\n      <td>FileReview6</td>\n      <td id=\"gen-priv-cli-milestone-508\"><a href=\"#gen-priv-cli-milestone-508\">508</a></td>\n    </tr>\n    <tr>\n      <td>FileReview7</td>\n      <td id=\"gen-priv-cli-milestone-509\"><a href=\"#gen-priv-cli-milestone-509\">509</a></td>\n    </tr>\n    <tr>\n      <td>FileReview8</td>\n      <td id=\"gen-priv-cli-milestone-510\"><a href=\"#gen-priv-cli-milestone-510\">510</a></td>\n    </tr>\n    <tr>\n      <td>FileReview9</td>\n      <td id=\"gen-priv-cli-milestone-511\"><a href=\"#gen-priv-cli-milestone-511\">511</a></td>\n    </tr>\n    <tr>\n      <td>FileReview10</td>\n      <td id=\"gen-priv-cli-milestone-512\"><a href=\"#gen-priv-cli-milestone-512\">512</a></td>\n    </tr>\n    <tr>\n      <td>DateClosed</td>\n      <td id=\"gen-priv-cli-milestone-513\"><a href=\"#gen-priv-cli-milestone-513\">513</a></td>\n    </tr>\n  </tbody></table></details>\n\n<details>\n<summary>General Property</summary>\n<table>\n  <thead><tr><th>Milestone</th><th>Milestone ID</th></tr></thead>\n  <tbody>\n    <tr>\n      <td>FileOpened</td>\n      <td id=\"general-property-milestone-237\"><a href=\"#general-property-milestone-237\">237</a></td>\n    </tr>\n    <tr>\n      <td>ClientCareSent</td>\n      <td id=\"general-property-milestone-238\"><a href=\"#general-property-milestone-238\">238</a></td>\n    </tr>\n    <tr>\n      <td>SignedCareRecd</td>\n      <td id=\"general-property-milestone-239\"><a href=\"#general-property-milestone-239\">239</a></td>\n    </tr>\n    <tr>\n      <td>ClientsIDVerified</td>\n      <td id=\"general-property-milestone-240\"><a href=\"#general-property-milestone-240\">240</a></td>\n    </tr>\n    <tr>\n      <td>2ndFileReview</td>\n      <td id=\"general-property-milestone-242\"><a href=\"#general-property-milestone-242\">242</a></td>\n    </tr>\n    <tr>\n      <td>3rdFileReview</td>\n      <td id=\"general-property-milestone-243\"><a href=\"#general-property-milestone-243\">243</a></td>\n    </tr>\n    <tr>\n      <td>4thFileReview</td>\n      <td id=\"general-property-milestone-244\"><a href=\"#general-property-milestone-244\">244</a></td>\n    </tr>\n    <tr>\n      <td>5thFileReview</td>\n      <td id=\"general-property-milestone-245\"><a href=\"#general-property-milestone-245\">245</a></td>\n    </tr>\n    <tr>\n      <td>LastestFileReview</td>\n      <td id=\"general-property-milestone-246\"><a href=\"#general-property-milestone-246\">246</a></td>\n    </tr>\n    <tr>\n      <td>DateClosed</td>\n      <td id=\"general-property-milestone-247\"><a href=\"#general-property-milestone-247\">247</a></td>\n    </tr>\n  </tbody></table></deta