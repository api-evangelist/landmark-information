/a></td>\n    </tr>\n    <tr>\n      <td>MemoOfSaleReceived</td>\n      <td id=\"sale-milestone-110\"><a href=\"#sale-milestone-110\">110</a></td>\n    </tr>\n    <tr>\n      <td>FFFormReceived</td>\n      <td id=\"sale-milestone-111\"><a href=\"#sale-milestone-111\">111</a></td>\n    </tr>\n    <tr>\n      <td>PropInfoFormReceived</td>\n      <td id=\"sale-milestone-112\"><a href=\"#sale-milestone-112\">112</a></td>\n    </tr>\n    <tr>\n      <td>PropQuestFormReceived</td>\n      <td id=\"sale-milestone-113\"><a href=\"#sale-milestone-113\">113</a></td>\n    </tr>\n    <tr>\n      <td>LeaseholdInfoFormReceived</td>\n      <td id=\"sale-milestone-114\"><a href=\"#sale-milestone-114\">114</a></td>\n    </tr>\n    <tr>\n      <td>OverridingQuestionnaireReceived</td>\n      <td id=\"sale-milestone-115\"><a href=\"#sale-milestone-115\">115</a></td>\n    </tr>\n    <tr>\n      <td>SurplusFormReceived</td>\n      <td id=\"sale-milestone-116\"><a href=\"#sale-milestone-116\">116</a></td>\n    </tr>\n    <tr>\n      <td>SignedCareLetterReceived</td>\n      <td id=\"sale-milestone-117\"><a href=\"#sale-milestone-117\">117</a></td>\n    </tr>\n    <tr>\n      <td>MoneyOnAccountReceived</td>\n      <td id=\"sale-milestone-118\"><a href=\"#sale-milestone-118\">118</a></td>\n    </tr>\n    <tr>\n      <td>DeedsRequested</td>\n      <td id=\"sale-milestone-119\"><a href=\"#sale-milestone-119\">119</a></td>\n    </tr>\n    <tr>\n      <td>RedStatsRequested</td>\n      <td id=\"sale-milestone-120\"><a href=\"#sale-milestone-120\">120</a></td>\n    </tr>\n    <tr>\n      <td>DeedsReceived</td>\n      <td id=\"sale-milestone-121\"><a href=\"#sale-milestone-121\">121</a></td>\n    </tr>\n    <tr>\n      <td>SolsInitialLetter</td>\n      <td id=\"sale-milestone-122\"><a href=\"#sale-milestone-122\">122</a></td>\n    </tr>\n    <tr>\n      <td>ContractIssued</td>\n      <td id=\"sale-milestone-123\"><a href=\"#sale-milestone-123\">123</a></td>\n    </tr>\n    <tr>\n      <td>LeaseholdI