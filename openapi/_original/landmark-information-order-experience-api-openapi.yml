    results-schema-11:
      title: Identity Verification Check (Results)
      x-tags:
      - Product Results Schemas
      properties:
        overallStatus:
          $ref: '#/components/schemas/overallStatus'
        livenessVerification:
          type: object
          properties:
            status:
              $ref: '#/components/schemas/checkStatus'
            hasBeenOverridden:
              type: boolean
            remarks:
              type: array
              items:
                type: string
        idVerification:
          type: object
          properties:
            documentType:
              type: string
              enum:
              - Unknown
              - AgentsLicense
              - DrivingLicense
              - ElectoralCard
              - ForeignerIdentificationCard
              - HealthCard
              - JobLicense
              - MembershipIdentificationCard
              - MilitaryIdentificationCard
              - NationalIdentificationCard
              - Passport
              - ProofOfAgeCard
              - TravelPermit
              - Visa
              - WeaponsLicense
            idDocument:
              type: object
              additionalProperties: false
              required:
              - dateChecked
              - facialMatch
              - nameMatch
              - nfcReadStatus
              properties:
                dateChecked:
                  type: string
                  format: date-time
                verificationReason:
                  type: string
                  maxLength: 1000
                facialMatch:
                  type: boolean
                nameMatch:
                  type: boolean
                nfcReadStatus:
                  type: string
                  enum:
                  - Unknown
                  - Passed
                  - Failed
                  - NotAttempted
                  - Skipped
                  - Unavailable
                  - NotAllowed
                  - NotTrusted
                  - NotApplicable
                  - Expired
                  - UnavailableWebJourney
                firstName:
                  type: string
                  maxLength: 100
                lastName:
                  type: string
                  maxLength: 100
                expiryDate:
                  type: string
                  format: date-time
            status:
              $ref: '#/components/schemas/checkStatus'
            hasBeenOverridden:
              type: boolean
            remarks:
              type: array
              items:
                type: string
        supportingDocuments:
          type: array
          items:
            type: object
            properties:
