          enum:
          - Pass
          - Refer
        overallStatus:
          type: string
          enum:
          - Pass
          - Refer
          - PassWarning
          - PassOverridden
  headers:
    lgsTraceResponse:
      description: Trace context providing an unique identifier for an individual requests
      schema:
        type: string
        minLength: 39
        maxLength: 39
        pattern: ^[0-9a-fA-F]{2}-[0-9a-fA-F]{32}--[0-9a-fA-F]{2}$
      examples:
        Example traceresponse:
          value: 00-199c8ce55dc743a88661498aa8eb2cfc--00
  responses:
    400BadRequest:
      description: Bad Request
      headers:
        traceresponse:
          $ref: '#/components/headers/lgsTraceResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/lgsErrorResponse'
            examples:
              Invalid content type supplied:
                value: null
                status: '400'
                code: '40000'
                title: Invalid content type supplied
              Validation error:
                value: null
                status: '400'
                code: '40001'
                title: Validation error
              Invalid traceparent http header:
                value: null
                status: '400'
                code: '40002'
                title: Invalid trace header
              No matching data found:
                value: null
                status: '400'
                code: '40003'
                title: No matching data found
              Invalid header:
                value: null
                status: '400'
                code: '40004'
                title: Invalid header
              Third party error:
                value: null
                status: '400'
                code: '40005'
                title: Third party error
    401Unauthorized:
      description: Unauthorized
      headers:
        traceresponse:
          $ref: '#/components/headers/lgsTraceResponse'
      content:
        application/problem+json:
