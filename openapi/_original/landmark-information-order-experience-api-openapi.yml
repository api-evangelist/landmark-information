            verificationReason: Reason
            facialMatch: true
            nameMatch: false
            nfcReadStatus: Passed
            firstName: John
            lastName: Doe
            expiryDate: '2024-12-20T13:54:18.135Z'
          status: Pass
          hasBeenOverridden: false
          remarks: []
        supportingDocuments:
        - documentName: Utility bill
          status: Pass
          hasBeenOverridden: false
          remarks: []
