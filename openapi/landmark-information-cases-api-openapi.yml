  /milestones:
    get:
      summary: Get milestone
      description: 'Returns the actual completion date of a milestone for a case. Supply at least one of `caseId` or `externalCaseId`.

        Valid `milestoneId` values are listed in [Supported milestone IDs by workflow](#supported-milestone-ids).

        '
      operationId: getMilestone
      tags:
      - Cases
      parameters:
      - name: branchId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/lgsUuid'
      - name: caseId
        in: query
        required: false
        schema:
          type: string
          maxLength: 25
          pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-/]*$
      - name: externalCaseId
        in: query
        required: false
        schema:
          type: string
          maxLength: 50
          pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-]*$
      - name: milestoneId
        in: query
        required: true
        description: Milestone identifier. See [Supported milestone IDs by workflow](#supported-milestone-ids) for valid values per workflow.
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: workflowId
        in: query
        required: false
        description: Optional workflow identifier. Include when required to resolve the milestone for the target workflow.
        schema:
          type: integer
          format: int32
          minimum: 1
      responses:
        '200':
          description: Milestone actual completion date found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/milestoneQueryResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError_2'
      security:
      - bearerAuth: []
    post:
      summary: Create or update milestone dates
      description: 'Set or update milestone actual and/or forecast dates for a case. The request is accepted for asynchronous processing.

        '
      operationId: upsertMilestone
      tags:
      - Cases
      requestBody:
        description: Request body containing milestone upsert data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/upsertMilestoneRequest'
      responses:
        '202':
          description: Accepted milestone upsert request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/upsertMilestoneResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError_2'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.landmarkcloudservices.com/
      description: Production API
    - url: https://uat-api.landmarkcloudservices.com/
      description: UAT API
  /documents:
    post:
      summary: Upload Document
      description: 'Uploads a document for the specified case against a task or default. At least one of `caseId` or `externalCaseId` is required.

        `taskId` is optional; when omitted the document is stored against a new default task rather than an existing task.

        Upload the file directly using `multipart/form-data`, or optionally use `application/json` with document metadata.

        '
      operationId: uploadDocument
      tags:
      - Cases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/uploadDocumentJsonRequest'
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - branchId
              - file
              anyOf:
              - required:
                - caseId
              - required:
                - externalCaseId
              properties:
                transactionId:
                  $ref: '#/components/schemas/lgsUuid'
                  description: Optional parent transaction from create case.
                branchId:
                  $ref: '#/components/schemas/lgsUuid'
                workflowId:
                  type: integer
                  format: int32
                  minimum: 1
                  description: Optional workflow identifier.
                caseId:
                  type: string
                  maxLength: 50
                  pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-/]*$
                  description: Intelliworks case reference (e.g. `EXP-000762`).
                externalCaseId:
                  type: string
                  maxLength: 50
                  pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-]*$
                  description: External case reference (e.g. `AAR801/1`).
                taskId:
                  $ref: '#/components/schemas/lgsUuid'
                  description: Optional task identifier. When omitted, a new default task is created and the document is stored against it.
                description:
                  type: string
                  maxLength: 500
                  pattern: ^[a-zA-Z0-9@ :#$%^&+=*()_+-/.,' ]*$
                file:
                  type: string
                  format: binary
                  description: Document file to upload.
      responses:
        '202':
          description: Document upload request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/uploadDocumentResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '406':
          $ref: '#/components/responses/500InternalServerError_2'
        '415':
          $ref: '#/components/responses/500InternalServerError_2'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError_2'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.landmarkcloudservices.com/
      description: Production API
    - url: https://uat-api.landmarkcloudservices.com/
      description: UAT API
