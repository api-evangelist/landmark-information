source: live probes of Landmark API, documentation and Auth0 identity hosts
description: >-
  Landmark serves no /.well-known/ discovery surface from its own hosts. Every path probed on
  api.landmarkcloudservices.com returns 403 from the edge (the API host rejects unauthenticated
  requests outright rather than serving discovery documents), and the documentation host
  www.landmarkcloudservices.com and the corporate site www.landmark.co.uk return 404. The only
  real discovery documents in Landmark's surface belong to its Auth0 tenants, which are the
  authorization servers named in every published OpenAPI: lmkmaster.eu.auth0.com (production) and
  lmkmaster-uat.eu.auth0.com (UAT). Those are captured here.
