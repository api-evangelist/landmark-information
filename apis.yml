name: Landmark Information Group
kind: company
description: >-
  Landmark Information Group is a United Kingdom property and land data business, part of Daily Mail
  and General Trust (DMGT), that sits in the middle of the UK residential and commercial property
  transaction rather than at the listing end of it. Founded in 1995 and headquartered in Exeter, it
  aggregates 700+ datasets from nearly 400 suppliers — Ordnance Survey mapping and AddressBase/UPRN
  addressing, environmental and flood and mining risk, historical maps, planning applications, and
  Barbour ABI project data — and sells them as conveyancing search reports (SearchFlow, Envirocheck,
  RiskView, SiteSolutions), estate agency compliance and material information products
  (LandmarkAgent, Metropix floor plans), case management software for property lawyers (Optimus,
  Intelliworks, Ochresoft, Vantage), and lender/surveyor valuation infrastructure (Secure Panel
  Network SPN and SPN+, Q-Guard). The UK has no MLS and no RESO equivalent — residential listings
  are controlled by the Rightmove/Zoopla duopoly and reached through agency CRMs — so Landmark is
  not a listings company; it is the transaction-data and workflow layer beneath conveyancers,
  lenders, surveyors, and agents. Its API posture is unusually honest for this sector: Landmark runs
  a genuinely public, un-gated API documentation portal at landmarkcloudservices.com that publishes
  full OpenAPI 3.x contracts for its Compliance/Order, Conveyancing, Intelliworks, Document Vault,
  and Milestone Notification APIs, plus a public HTML technical pack for the Barbour ABI-powered
  Planning API. Reading the contracts is open to anyone; calling them is not. Every API is
  OAuth 2.0 client-credentials against Landmark's Auth0 tenant with a client ID and secret issued
  only after a commercial account is onboarded ("your Landmark contact will confirm what's available
  to you"), and the Planning API requires a paid subscription or pay-as-you-go agreement plus an
  API key issued by Landmark. There is no RESO Web API certification, no RESO Data Dictionary
  posture, no OData $metadata document and no Universal Property Identifier anywhere in Landmark's
  surface — RESO is a North American MLS construct and is simply absent from the UK market.
  Landmark publishes no open data of its own; the open UK property layer belongs to HM Land Registry
  and Ordnance Survey, both of which are Landmark suppliers rather than Landmark products.
