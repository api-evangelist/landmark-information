- aid: landmark-information:landmark-conveyancing-experience-api
  name: Landmark Conveyancing Experience API
  description: >-
    Panel conveyancing API for quoting, instructing and managing conveyancing work through Landmark
    Optimus. Introducers create quotes, choose a conveyancer and instruct on a client's behalf;
    conveyancers accept or reject assigned cases and progress them against one shared case record.
    Twenty paths across Quotes and Cases including quote PDF generation, persons, instruct,
    accept/reject, status, handler, activities, tasks, notes and documents. Version 0.8.1, OpenAPI
    3.0.3, with several endpoints explicitly marked Preview and not yet safe to build against.
    Uses OData-style $filter and $orderby query parameters, but is not an OData service and
    publishes no $metadata document.
