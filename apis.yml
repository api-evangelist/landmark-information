- aid: landmark-information:landmark-document-vault-api
  name: Landmark Document Vault API
  description: >-
    API behind Contract Pack Vault — creates a secure, shareable container of transaction documents,
    adds and removes files (virus-scanned and analysed asynchronously, status Pending then Available
    or Quarantined), maintains property and reference details, manages the recipient organisation
    and its recipients, and reads the vault activity audit trail. Ten paths, version 1.0.1, OpenAPI
    3.0.4. Sharing itself happens in the Contract Pack Vault web app, not the API. Billed per vault
    on first document added; documented rate limit 1,000 calls per minute per caller.
