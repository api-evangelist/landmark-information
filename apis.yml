- aid: landmark-information:landmark-planning-api
  name: Landmark Planning API (powered by Barbour ABI)
  description: >-
    RESTful planning-application data API combining Barbour ABI project information with Landmark
    geospatial data, covering UK and Republic of Ireland planning applications from 1 January 2017
    (with historical project data back to 1997) across 19 documented attributes including UPRN,
    easting/northing, latitude/longitude and GeoJSON/WKT site boundaries. Documented operations are
    GET login, GET logout, GET customers, GET lookups, GET locations (preview search with a JSON
    query DSL and point-radius distance filtering) and GET locations/{project_id} (full details,
    which consumes a credit under pay-as-you-go). Documented in public HTML only — no OpenAPI,
    Postman collection, or other machine-readable contract is published. Authentication is a
    Landmark-issued x-api-key plus a Basic-auth login (base64 of username and SHA256-hashed
    password) that returns a bearer token valid until 30 days of disuse.
  humanURL: https://www.landmark.co.uk/products/planning-api/planning-api-documentation/
  baseURL: https://api.barbour-abi.com/v4
  tags:
  - Planning
  - Geospatial
  - Land Development
  - Commercial Real Estate
  properties:
  - type: Documentation
    url: https://www.landmark.co.uk/products/planning-api/
  - type: APIReference
    url: https://www.landmark.co.uk/products/planning-api/planning-api-documentation/
- aid: landmark-information:landmark-geodata-web-map-tile-service
  name: Landmark Geodata Web Map Tile Service (WMTS)
  description: >-
    On-demand raster mapping tile service delivered against the Open Geospatial Consortium Web Map
    Tile Service (OGC WMTS) standard, with 20 zoom levels spanning Ordnance Survey MasterMap through
    national-scale mapping, for use inside GIS platforms and web applications. Landmark documents
    the product and names the standard publicly but publishes no endpoint URL and no
    GetCapabilities document; access begins with a register-your-interest form at
    geodata.landmark.co.uk and a commercial agreement, so no baseURL is recorded here.
  humanURL: https://www.landmark.co.uk/products/web-map-tile-service-0/
  tags:
  - Geospatial
  - Mapping
  - WMTS
  - OGC
  properties:
  - type: Documentation
    url: https://www.landmark.co.uk/products/web-map-tile-service-0/
  - type: SignUp
    url: https://geodata.landmark.co.uk/register-your-interest-in-wmts
