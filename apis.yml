- aid: landmark-information:landmark-information-cases-api
  name: Landmark Information Group Cases API
  description: >-
    Once you instruct a quote it becomes a case. If you're the conveyancer, these are the cases assigned
    to you: you work them through to completion and post updates as you go. If you're the introducer,
    this is how you follow the work you've referred and see how it's progressing. Either way, you only
    see the cases your account is party to.


    From here you can retrieve your cases, read the full detail of one, update its status and handler,
    work the task hierarchy, follow the activity history, and add notes. Document exchange is marked Preview.
