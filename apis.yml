- aid: landmark-information:landmark-information-quotes-api
  name: Landmark Information Group Quotes API
  description: >-
    Quotes are where a job begins. You build a quote for your client's transaction, get back the panel
    conveyancers available to you with their pricing, and instruct one of them to turn the quote into
    a live case.


    A single request can cover a standalone transaction (one quote) or a combined sale and purchase (two
    quotes, one for each side). You choose what you're quoting for with a product schema, which sets the
    questions that apply. See [Product Schemas](#tag/Product-Schemas).


    To instruct, pass the `conveyancerId` of one of the conveyancers returned for the quote. That creates
    the case and makes the details available to the conveyancer you've chosen.
