description: >-
  Which cross-cutting and industry standards the Landmark Cloud Services APIs actually conform to,
  asserted from the machine-readable contracts and the published documentation. Landmark makes no
  explicit conformance or certification claim anywhere in its public API surface, so every entry
  here is derived evidence rather than a vendor claim.
standards:
- id: openapi-3
  conforms: true
  evidence: >-
    Five public OpenAPI documents, versions 3.0.1, 3.0.3 and 3.0.4, published as the rendered
    reference on landmarkcloudservices.com.
- id: oauth2
  conforms: true
  evidence: >-
    securitySchemes declare oauth2 with the clientCredentials flow against
    https://lmkmaster.eu.auth0.com/oauth/token; four further specs declare the resulting JWT as an
    http bearer scheme.
- id: oauth2-client-credentials
  conforms: true
  evidence: RFC 6749 section 4.4 grant, with an audience parameter per environment.
- id: oidc-discovery
  conforms: true
  evidence: >-
    The authorization server publishes /.well-known/openid-configuration and
    /.well-known/oauth-authorization-server (Auth0 tenant lmkmaster.eu.auth0.com); captured in
    well-known/ and authentication/.
- id: rfc8414-authorization-server-metadata
  conforms: true
  evidence: /.well-known/oauth-authorization-server returns 200 on the Auth0 tenant.
- id: jwt
  conforms: true
  evidence: bearerFormat JWT on every http bearer scheme; jwks_uri published by the tenant.
- id: rfc9457-problem-details
  conforms: partial
  evidence: >-
    Every error response is served as application/problem+json, but the body uses Landmark members
    (status, code, title, messages[]) instead of the RFC's type/title/status/detail/instance, and
    no dereferenceable problem type URI is published.
- id: w3c-trace-context
  conforms: true
  evidence: >-
    A traceparent request header is accepted and validated (a malformed value returns 400 with
    error code 40002); every response carries a traceresponse header.
- id: rfc8594-sunset-header
  conforms: false
  evidence: No Sunset or Deprecation header support and no deprecation policy is published.
- id: idempotency-key
  conforms: false
  evidence: No idempotency key header or parameter appears in any spec or in the documentation.
- id: odata-v4
  conforms: false
  evidence: >-
    The Conveyancing Experience API borrows $filter, $orderby, $top and $skip query syntax but
    publishes no $metadata document and no OData service root; it is OData-flavoured, not OData.
- id: json-api
  conforms: false
- id: hal
